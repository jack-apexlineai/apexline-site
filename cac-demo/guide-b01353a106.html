<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Presenter guide</title>
<link rel="icon" href="brand/cac-favicon.png">
<style>
:root{--bg:#111113;--card:#1C1C20;--line:#2E2E34;--tx:#F4F4F5;--mu:#A1A1AA;--or:#EB9347;--gr:#34D399;--rd:#F87171;--am:#FBBF24;--say:#22201C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:#7F1D1D;color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:5px 8px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;flex:1;min-width:180px}
.top h1 small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.conn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rd)}
.dot.on{background:var(--gr)}
.btn{background:#27272A;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:#52525B}
.btn.pri{background:var(--or);border-color:var(--or);color:#1A1209;font-weight:700}
.btn.big{padding:12px 20px;font-size:16px}
.btn.sm{padding:4px 9px;font-size:12.5px}
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 100px)}
.list{border-right:1px solid var(--line);padding:10px 0;overflow:auto;max-height:calc(100vh - 100px);position:sticky;top:28px}
.list .sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);padding:12px 16px 4px}
.list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:5px 16px;font-size:13.5px}
.list button.cur{color:var(--tx);background:#26262B;box-shadow:inset 3px 0 var(--or)}
.list button.seen{color:#D4D4D8}
.main{padding:18px 22px 120px;max-width:820px}
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--mu)}
.clock b{font-variant-numeric:tabular-nums;color:var(--tx);font-size:18px}
.clock .late{color:var(--rd)} .clock .ok{color:var(--gr)}
.step .meta{font-size:12px;color:var(--or);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.step h2{margin:2px 0 12px;font-size:24px;line-height:1.25}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.blk h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.blk ol,.blk ul{margin:0;padding-left:20px}
.blk li{margin:3px 0}
.say{background:var(--say);border-color:#5A4630}
.say p{margin:6px 0;font-size:17px;line-height:1.45}
.say p::before{content:"\201C";color:var(--or);font-weight:700;margin-right:2px}
.say p::after{content:"\201D";color:var(--or);font-weight:700}
.say .stage{font-size:13px;color:var(--mu);font-style:italic}
.say .stage::before,.say .stage::after{content:none}
.watch{border-color:#5B4A1A}
.watch h3{color:var(--am)}
.ask h3{color:#93C5FD}
.extra{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.skipbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1px dashed #52525B;border-radius:10px;font-size:14px;color:#D4D4D8}
.skipbar .btn{margin-left:auto}
.list button.opt{font-style:italic;opacity:.8}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(17,17,19,.96);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 16px;z-index:6}
.nav .grow{flex:1;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:12.5px;color:var(--mu);margin:-4px 0 12px;min-height:18px}
.status.err{color:var(--rd)}
textarea{width:100%;min-height:90px;background:#0C0C0E;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.calc{display:grid;grid-template-columns:1fr 110px;gap:6px 10px;align-items:center;font-size:13.5px}
.calc input{width:100%;background:#0C0C0E;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;text-align:right}
.calc .sub{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--or);margin-top:8px}
.tot{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:4px 0}
.tot b{font-variant-numeric:tabular-nums}
.verdict{margin-top:8px;padding:10px 12px;border-radius:8px;background:#0C0C0E;font-size:15px}
.links input{width:100%;background:#0C0C0E;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
.links .r{display:flex;gap:8px;margin:6px 0}
dl.gl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}
dl.gl dt{font-weight:700}
dl.gl dd{margin:0;color:#D4D4D8}
.glo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.glo.open{display:flex}
.glo .in{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;padding:18px 20px}
kbd{background:#27272A;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .list{display:none}
  .main{padding:14px 16px 120px}
  .step h2{font-size:20px}
  .say p{font-size:16px}
  dl.gl{grid-template-columns:1fr}
  dl.gl dd{margin-bottom:6px}
}
</style>
</head>
<body>
<div class="bar">Presenter only. Never share this window</div>
<div class="top">
  <h1>John Pesci, CAC Waste Management<small>Mon 23 Nov, 14:00 UK (21:00 Thai), Teams, 30 min</small></h1>
  <span class="conn"><span class="dot" id="dot"></span><span id="connTx">Demo window not open</span></span>
  <button class="btn" id="openDemo">Open the demo window</button>
  <button class="btn" id="glossBtn">Words</button>
</div>
<div class="wrap">
  <nav class="list" id="list" aria-label="Steps"></nav>
  <main class="main">
    <div class="clock"><span>Call clock</span><b id="clk">0:00</b><span id="clkNote">Press Start when John joins</span><button class="btn sm" id="clkBtn">Start</button></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div id="step" class="step"></div>
  </main>
</div>
<div class="nav">
  <button class="btn" id="back">Back</button>
  <span class="grow" id="nextName"></span>
  <button class="btn" id="redo" title="Set the demo screen up again">Redo screen</button>
  <button class="btn pri big" id="next">Next</button>
</div>
<div class="glo" id="glo" role="dialog" aria-label="Words in plain English"><div class="in">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:17px">Words in plain English</b><button class="btn sm" id="glossClose">Close</button></div>
  <dl class="gl" id="gl"></dl>
</div></div>

<script>
(function () {
  var NOTES_KEY = 'cac-guide-notes', STEP_KEY = 'cac-guide-step', CALC_KEY = 'cac-guide-calc', CLOCK_KEY = 'cac-guide-clock';
  function get(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function h(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(s) { return document.querySelector(s); }

  var SECS = { prep: { n: 'Before the call', end: 0 }, q: { n: 'Questions', end: 5 }, demo: { n: 'The demo', end: 19 }, more: { n: 'Only if he asks', end: 19 }, ask: { n: 'The question', end: 19 }, val: { n: 'Value and price', end: 25 }, close: { n: 'Close', end: 30 } };

  var STEPS = [
    { id: 'prep', sec: 'prep', t: 'Ten minutes before', act: 'reset',
      do: ['Press <b>Open the demo window</b> at the top. Put it on the left, this guide on the right.',
           'Opening it resets the demo and turns live messages off. If you clicked around since, press <b>Redo screen</b>.',
           'In the demo, Settings: if John has named his BDE, put the first name in. Otherwise leave it as Sam.',
           'Teams: when you share, pick <b>Window</b>, then the demo window. Not this one, not the whole screen.',
           'Phone on silent. Light theme on the demo (his brand is white and orange).',
           'Have the notes box below open. His words go in there during the questions.'],
      shows: 'Nothing is shared yet. This guide sets up every screen for you: press Next and the demo window jumps to the right place.',
      notes: true },

    { id: 'open', sec: 'q', t: 'Open the call', act: 'home',
      do: ['Camera on, smile, no screen share yet.', 'Say the opener, then ask the one question and stop talking.'],
      say: ['Hi John, thanks for making the time. I know you said you\'re busy, and you said don\'t waste your 30, so I won\'t.',
            'Before I show you anything, what made you want to take the call?',
            { stage: 'Then silence. Count to five in your head if you need to. Let him fill it.' }],
      watch: ['Don\'t hand him the answer ("an admin problem"). Let him say it in his words.', 'Never bring up his past employers or anything personal. Only what he tells you on the call.'],
      notes: true },

    { id: 'clarify', sec: 'q', t: 'Dig in (only what you need)', act: null,
      do: ['Ask one at a time. Write his exact words and any numbers in the notes box.', 'Skip any he has already answered.'],
      say: ['Walk me through a job, from a builder getting in touch to the invoice going out. Who touches it?',
            'Where do enquiries come in today? WhatsApp, calls, the website?',
            'Roughly how many jobs a month now? Where does that go once your BDE is up and running?',
            'When a supplier hasn\'t confirmed, how do you find out?',
            'How do the WTNs get back to you, and where do they end up?',
            'How many hours a week does all that take? Whose hours?',
            'What systems have you used before, here or anywhere else? What did they cost?',
            { stage: 'Let HIM name the system and the price. If he says Weighsoft or a big number, write it down: that\'s your anchor at the price step.' }],
      watch: ['Don\'t name Weighsoft, any system or any firm he\'s worked for first. Never knock Weighsoft. Compare on public price only.'],
      notes: true },

    { id: 'label', sec: 'q', t: 'Label it, then what he\'s tried', act: null,
      do: ['Read his own words back from the notes. Then the past attempts question.'],
      say: ['So if I\'ve got it right: [his words]. Is that about right?',
            'You\'ve been in this game a long time. When the places you\'ve worked got busy, what did they do about the admin?',
            { stage: 'Usually: hired more office staff.' },
            'And how did that work out?',
            { stage: 'Usually: it worked, but it cost a lot and took ages to train. That hire is your price anchor later.' }],
      notes: true },

    { id: 'perm', sec: 'q', t: 'Ask permission, then share', act: 'home',
      do: ['Ask permission.', 'On his yes: Teams, Share, Window, the demo window.', 'Then press Next.'],
      say: ['Want me to show you what I\'ve built round CAC? Shout if any of it\'s not how you\'d do it.'] },

    { id: 'startup', sec: 'demo', t: 'The start-up screen', act: 'startup',
      do: ['Let it play for a few seconds. Then click <b>Straight in</b>.'],
      shows: 'His logo, "Good afternoon, John", how many messages need him, jobs waiting on suppliers, margin this month, and the line from his own website.',
      say: ['This is what you\'d open every morning. That line at the bottom is off your own website.'] },

    { id: 'homeDash', sec: 'demo', t: 'Home. Calm, his page', act: 'homeDash', mins: 0.75,
      do: ['The Home page is open. Let him read the top line. Then point along the tiles: New order, inbox, today, orders this month, skips on site, chasing, money, quotes gone quiet.', 'Grab the <b>Money</b> tile by its top bar and drag it to the front. It stays where he puts it.', 'Optional: press <b>Arrange</b>. That shows the arrows and the X, and four more tiles he can add.'],
      say: ['This is the first thing you see in the morning. Good morning John, and what needs you. Nothing else.', 'And you lay it out how you want it. Put what you care about first.'],
      shows: 'One greeting, one line, then eight tiles. Each tile is one number and a button into that part of the system. He drags them into his own order and it remembers.',
      watch: ['The layout is saved in this browser for the demo. Live, it is saved to his login so it follows him to any device.'] },

    { id: 'gemma', sec: 'demo', t: 'Gemma\'s order, step by step', act: 'gemma', mins: 1.5,
      do: ['Gemma Shaw\'s email is open: a welfare unit and 2 toilets at Wells for 8 weeks from Monday. On the right it says <b>Response drafted</b>.', 'Step 1, "Can we do it on Monday?". Tap <b>No, pick another date</b>, then pick a day. Or just tap Yes.', 'Step 2, the price. It is filled in from his price book. Tap <b>Price is right</b>.', 'Step 3. Read him the reply, then tap the big green button: <b>Book with supplier and send invoice and confirmation to Gemma</b>.', 'Point at the ticks: job made, supplier booked, reply sent, invoice and order confirmation sent.'],
      say: ['An order comes in. It has already read it and drafted the reply. All it needs from you is three answers.', 'Can we do the date. What is the price. Send it.', 'That was the supplier booked, Gemma told, the invoice raised and the order confirmation sent. One tap.'],
      shows: 'Any order that comes in gets the same three steps: date, price, send. Say no to the date and it offers the days you can do and rewrites the reply. The last tap books the supplier and sends the customer the reply, the invoice and the order confirmation together.',
      watch: ['Press <b>Esc</b> to close a chat. The inbox then shows the list on the left and the CAC logo in the middle, like WhatsApp on a Mac.', 'The invoice is made in this system. Pushing it into his accounts is a link we set up (Xero or QuickBooks only). Do not name any other accounts package.', 'The Assistant button at the top opens one list of everything that needs doing. It is not on screen all the time any more.'] },

    { id: 'order', sec: 'demo', t: 'Place an order', act: 'order', mins: 1.25,
      do: ['The New order screen is open. It is the orange button at the top left of every page, or press O.', 'Pick a customer. The site, the contact name and the number fill in. Pick a service, size, date and time.', 'On the right: the suppliers who cover it with their price, his price and the margin. Change the price if he wants.', 'Pick how they pay, then tap <b>Place the order</b>.', 'On the done screen tap <b>Order confirmation</b>, then <b>Invoice</b>, then <b>See it in the diary</b>.'],
      say: ['Someone rings and just wants it booked. Customer, site, what, when.', 'One tap. Supplier booked, invoice raised, order confirmation and invoice sent to the customer.'],
      shows: 'A proper order screen: customer, site address, site contact name and number, service, date, supplier and price. Placing it makes the job, sends the booking to the supplier, raises the invoice and sends the customer their order confirmation and invoice. The order then shows in the diary, on Live jobs, Skips on site and Money.',
      watch: ['Card payments and pay by card links run through HIS OWN Stripe account, which we connect when we set him up. In the demo no card is taken. Say "through your own Stripe".', 'Nothing is really sent in the demo.'] },

    { id: 'diary', sec: 'demo', t: 'The order diary', act: 'diary', mins: 1.5,
      extra: [{ l: 'Open one order', act: 'orderPage' }, { l: 'Show the week', act: 'diaryWeek' }, { l: 'Show the list with filters', act: 'diaryList' }],
      do: ['The diary is open on this month. Each day shows how many orders and what they came to.', 'Press the <b>left arrow</b> to flick back to October, then September, then August. Press <b>Today</b> to come back.', 'Tap any day to see that day\'s orders.', 'Press <b>Open one order</b> above. Point at the timeline on the right, then the documents, then <b>Repeat this order</b>.', 'Optional: press <b>Show the list with filters</b> and pick a customer.'],
      say: ['Every order you have taken, in one diary. Flick back a month, flick forward to what is booked.', 'Open any one and it is all there. When it was booked, delivered and collected, the note, the invoice, when it was paid.', 'Same customer wants the same again? One tap.'],
      shows: 'A month, week and day diary of every order, with the count and the value on each day, back to his first order in August. A list with search and filters for customer, supplier, service, status and paid. Each order has its own page: the full timeline, documents, messages, margin and a repeat button.',
      watch: ['The past orders are made-up sample history, sized to match the sample monthly figures. They start in August because that is when CAC started trading.', 'Waste transfer note: the legal slip that says what waste left the site and where it went.'] },

    { id: 'trends', sec: 'demo', t: 'Trends and the forecast', act: 'trends', mins: 1,
      do: ['Trends is open. Read the top row out loud: orders, sales and margin this month against the same point last month.', 'Point at the bar chart, then the forecast box on the right.', 'Scroll down once: by service, top customers, quotes won, busiest days, collections to book.'],
      say: ['Are you taking more work than last month, or less? That is the first line. No spreadsheet.', 'And this is where the month is heading if it carries on like this.', 'Which service makes you the most, which customer is growing, which one has dropped off.'],
      shows: 'This month against the same point last month in plain words, sales by month since he started, an estimate of where this month will finish, sales and margin by service, top customers with up or down against last month, quotes won, repeat customers, busiest days, and skips due off hire in the next 7 and 14 days.',
      watch: ['The forecast is an estimate from what he has taken each working day this month. Say estimate. Never say it predicts.', 'There is no year on year line yet because CAC started in August. The page says so. Do not invent one.', 'The figures are sample data.'] },

    { id: 'bills', sec: 'demo', t: 'Supplier bill check. Slow down here', act: 'bills', mins: 1.5,
      extra: [{ l: 'Read the sample statement', act: 'billSample' }],
      do: ['Bill check is open. Tap <b>Use a sample statement</b>, or press the button above.', 'Wait a second. Twelve lines come back. Seven match. Five are red.', 'Read two of the red ones out: charged as a 12 yard when he booked an 8, and the same job charged twice.', 'Point at the big number top left: overcharged this month.', 'Tap <b>Draft the query</b>. The email to their accounts person is written. Tap <b>Send the query</b>.'],
      say: ['When a supplier sends their statement, who checks every line against what you actually booked?', 'This does. Wrong size, extra hire, overweight with no ticket, the same job twice, a price above their own sheet.', 'That is money you would have just paid. And the email to their accounts is already written.'],
      shows: 'A supplier statement lined up against the orders, line by line. It flags a wrong size, extra hire days, an overweight charge with no weighbridge ticket, a job charged twice and a price above the agreed sheet. It adds up the overcharge and drafts the query to the supplier\'s accounts contact.',
      watch: ['The statement in the demo is a sample. Live, an AI model reads the real file and he checks it. Messy scans need testing on his real statements.', 'It can only catch what the supplier has put on the bill. The amounts are sample data, not a promise of what he will save.', 'Weighbridge ticket: the printout from the scales at the tip that proves the weight.'] },

    { id: 'handbook', sec: 'demo', t: 'The supplier handbook', act: 'handbook', mins: 1.5,
      do: ['The Supplier handbook is open. Point at the box at the top: <b>To stay compliant</b>. A waste carrier licence runs out in 3 weeks.', 'Tap <b>Ask for the new one</b> on that row.', 'Open any skip supplier in the list. Point at: contacts, accounts team, hire period, fuel surcharge, their prices, licences.', 'Tap <b>Upload a price sheet</b>, then <b>Use a sample sheet</b>. It shows old price against new. Tap <b>Looks right, save it</b>.', 'Open a supplier marked "Not set up", tap <b>Set up</b> under Waste transfer notes, then <b>Use a sample note</b>. Answer the two it asks about, then save.'],
      say: ['Everything about every supplier lives here. Who to ring, who does the accounts, what they charge, their fuel surcharge, how long their hire is.', 'When they send a new price sheet you upload it, check it, done. Every quote uses the new prices.', 'And it keeps you compliant. It tells you a month before a licence runs out.', 'You show it one of their tickets, once. After that it knows where to look on every ticket from them.'],
      shows: 'One page per supplier: bookings contact, accounts team, prices, fuel surcharge, standard hire period, waste carrier licence, permit and insurance with end dates. A price sheet upload with a check step. A one time set up so each supplier\'s waste transfer notes read themselves.',
      watch: ['Licence tracking works from the end dates on the documents he uploads, with reminders. It is NOT an automatic check against the Environment Agency register. Do not say it checks the register.', 'In the demo the uploads use a sample. Live, an AI model reads the real file and he checks it before it saves.', 'The price book (his own selling prices) now lives inside the handbook, top right of the supplier list.'] },

    { id: 'skips', sec: 'demo', t: 'Skips on site and live jobs', act: 'skips', mins: 1,
      extra: [{ l: 'Show live jobs today', act: 'livejobs' }, { l: 'Show notes that file themselves', act: 'wtnauto' }],
      do: ['Skips on site is open. Point at the hire period, days on site and the red <b>Collection needs booking</b>.', 'Tap <b>Book collection</b> on a red one.', 'Press <b>Show live jobs today</b> above: date, site address, service, site contact, status, supplier and the supplier\'s ETA.', 'Optional: press <b>Show notes that file themselves</b>.'],
      say: ['As a broker you don\'t need a jobs board. You need to know what is sitting on site and what is moving today.', 'Every skip, whose it is, how long that supplier gives you, and how long it has been there.', 'And today\'s jobs with who to ring on site and when the supplier said they would be there.'],
      shows: 'Skips on site uses each supplier\'s own hire period from the handbook and flags anything past it, with the extra hire it is running up. Live jobs today is the tracking sheet: date, site address, service, site contact name and number, status, supplier, ETA and notes.',
      watch: ['The ETA is the window the supplier gave when they confirmed. It is not live vehicle tracking. Do not say it tracks the lorry.', 'Notes that file themselves: his supplier emails a waste transfer note, it is picked up from his inbox, read and filed. That needs his own sign in to link the mailbox, Outlook or Gmail. Anything not back after 1 or 2 weeks, it asks if he wants to chase. It never chases on its own.'] },

    { id: 'chasing', sec: 'demo', t: 'Chasing, done for him', act: 'chasing', mins: 0.75,
      do: ['Chasing is open. Point at the lists: suppliers who have not confirmed, customers who have not paid, notes not back, quotes gone quiet.', 'Tap one chase button so he sees the message it sends.', 'That is the last main screen. Press <b>Skip to the reinforce question</b> below, or carry on into the extras if he is asking for more.'],
      say: ['Everything that is waiting on somebody else, in one place, with the chase already written.', 'This is the list you would otherwise keep in your head.'],
      shows: 'One page of everything waiting on someone else, with the chase message written for each one.',
      watch: ['In the demo nothing is really sent.'] },

    { id: 'inbox', sec: 'more', opt: true, t: 'His inbox, his message', act: 'inbox', mins: 2,
      extra: [{ l: 'Turn live messages on', act: 'liveOn' }],
      do: ['Hannah\'s web enquiry is open. Point at the fields on the left of the message.', 'Press <b>Turn live messages on</b> above and let two messages land (a few seconds each).'],
      shows: 'Every WhatsApp, email and Get a quote form, from customers and suppliers, in one list. Each one is already read and has a reply drafted. Hannah\'s card shows the exact fields from his own website form, plus "Came from: Google Ads".',
      say: ['WhatsApp, email and your Get a quote form. Customers and suppliers. One screen, every one already read.',
            'See this? It even tells you which Google Ad she came from.'],
      watch: ['The demo "AI" is a rules-based stand-in that shows the flow. Live, an AI model reads each message against CAC\'s own rates. Nothing sends without a person tapping it.'] },

    { id: 'testwa', sec: 'more', opt: true, t: 'His own message, priced', act: 'testwa', mins: 2,

    ['sub', 'C. Margin recovered'], ['jobs', 'Jobs a month'], ['xpct', 'Out of 100 jobs, how many have an extra'], ['xamt', 'Typical extra, £'], ['npct', 'Out of 100 extras, how many NOT passed on'],
    ['sub', 'D. Jobs won'], ['lost', 'Enquiries lost a month'], ['marg', 'Average margin a job, £'],
    ['sub', 'E. Tools it replaces'], ['tools', 'Paying for software now, £ a month']
  ];
  var calc = get(CALC_KEY, {});
  function n(k) { var v = parseFloat(calc[k]); return isFinite(v) ? v : 0; }

    if (s.do) html += '<div class="blk"><h3>Do this</h3><ol>' + s.do.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol></div>';
    if (s.say) html += '<div class="blk say"><h3>Say</h3>' + sayHtml(s.say) + '</div>';
    if (s.shows) html += '<div class="blk"><h3>What it shows</h3>' + (s.shows.charAt(0) === '<' ? s.shows : '<div>' + s.shows + '</div>') + '</div>';
    if (s.say2) html += '<div class="blk say"><h3>Then say</h3>' + sayHtml(s.say2) + '</div>';
    if (s.calc) html += calcHtml();
    if (s.verdict) html += '<div class="blk"><h3>His numbers against the price</h3>' + verdictHtml() + '</div>';
    if (s.ask) html += '<div class="blk ask"><h3>If he asks</h3><ul>' + s.ask.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
    if (s.links) html += linksHtml();
    if (s.watch) html += '<div class="blk watch"><h3>Only say what\'s true</h3><ul>' + s.watch.map(function (x) { return '<li>' + h(x) + '</li>'; }).join('') + '</ul></div>';
    if (s.notes) html += '<div class="blk"><h3>His words and numbers</h3><textarea id="notes" placeholder="Write what he says, word for word">' + h(get(NOTES_KEY, '')) + '</textarea></div>';
    $('#step').innerHTML = html;
    $('#back').disabled = cur === 0;
    $('#next').textContent = cur === STEPS.length - 1 ? 'Done' : 'Next';
    $('#nextName').textContent = cur < STEPS.length - 1 ? 'Next: ' + STEPS[cur + 1].t : 'Last step';
    $('#redo').disabled = !s.act;
    renderList(); tick(); window.scrollTo(0, 0);
  }
  function linksHtml() {
    var base = location.href.replace(/[^/]*$/, '');
    var L = [['The office, opens on a short tour', base + '?tour=1'], ['The phone view', base + 'phone.html'], ['A customer\'s own link (Kerry, Pellow Homes)', base + 'portal.html?c=c2']];
    return '<div class="blk links"><h3>Links for the Teams chat</h3>' + L.map(function (l, i) { return '<div style="font-size:13px;color:var(--mu);margin-top:6px">' + h(l[0]) + '</div><div class="r"><input readonly id="lk' + i + '" value="' + h(l[1]) + '"><button class="btn sm" data-copy="lk' + i + '">Copy</button></div>'; }).join('') + '</div>';
  }
  function renderList() {
    var out = '', last = '';
    STEPS.forEach(function (s, i) {
      if (s.sec !== last) { out += '<div class="sec">' + h(SECS[s.sec].n) + '</div>'; last = s.sec; }
      out += '<button data-i="' + i + '" class="' + (i === cur ? 'cur' : seen[i] ? 'seen' : '') + (s.opt ? ' opt' : '') + '">' + (i + 1) + '. ' + h(s.t) + '</button>';
    });
    $('#list').innerHTML = out;
  }
  function goTo(i) { if (i < 0 || i >= STEPS.length) return; cur = i; status(''); render(); run(STEPS[cur].act); }

  $('#next').onclick = function () { if (cur < STEPS.length - 1) goTo(cur + 1); };
  $('#back').onclick = function () { goTo(cur - 1); };
  $('#redo').onclick = function () { run(STEPS[cur].act); };
  $('#list').onclick = function (e) { var b = e.target.closest('[data-i]'); if (b) goTo(+b.dataset.i); };
  document.addEventListener('click', function (e) {
    var r = e.target.closest('[data-run]'); if (r) run(r.dataset.run);
    if (e.target.closest('[data-skip]')) { for (var k = 0; k < STEPS.length; k++) if (STEPS[k].id === 'reinforce') { goTo(k); break; } }
    var c = e.target.closest('[data-copy]'); if (c) { var inp = document.getElementById(c.dataset.copy); inp.select(); try { navigator.clipboard.writeText(inp.value); } catch (er) { document.execCommand('copy'); } c.textContent = 'Copied'; setTimeout(function () { c.textContent = 'Copy'; }, 1500); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'notes') put(NOTES_KEY, e.target.value);
    if (e.target.dataset && e.target.dataset.k) { calc[e.target.dataset.k] = e.target.value; put(CALC_KEY, calc); var o = $('#calcOut'); if (o) o.innerHTML = calcOut(sums()); }
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); $('#next').click(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); $('#back').click(); }
    if (e.key === 'Escape') $('#glo').classList.remove('open');
  });
  $('#gl').innerHTML = GLOSS.map(function (g) { return '<dt>' + h(g[0]) + '</dt><dd>' + h(g[1]) + '</dd>'; }).join('');
  $('#glossBtn').onclick = function () { $('#glo').classList.add('open'); };
  $('#glossClose').onclick = function () { $('#glo').classList.remove('open'); };
  $('#glo').onclick = function (e) { if (e.target.id === 'glo') $('#glo').classList.remove('open'); };
  render();
  window.CACGUIDE = { steps: STEPS.length, ids: STEPS.map(function (s) { return s.id; }), goTo: goTo, cur: function () { return cur; } };
})();
</script>
</body>
</html>
