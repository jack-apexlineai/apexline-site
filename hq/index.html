<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1A;--side:#0C1320;--card:#111A2A;--card2:#16213A;--line:#1F2B40;--text:#E7ECF4;--muted:#8B97AD;--accent:#5CC8F5;--hud:#5CE1FF;--good:#34D399;--warn:#FBBF24;--bad:#F87171;--violet:#A78BFA;--r:16px;--sideW:236px;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--head:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html{background:var(--bg)}
body{background:radial-gradient(1100px 520px at 75% -8%,rgba(40,90,150,.28) 0%,transparent 60%),var(--bg);min-height:100vh}
a{color:var(--accent)}
button,a,.tc,label{-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0B1322;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=number]{width:96px}
button{background:var(--accent);color:#06121F;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
button.x{background:transparent;color:var(--muted);padding:4px 8px;border:0;font-weight:500}
button.sm{padding:6px 12px;font-size:13px}
button:disabled{opacity:.5}

/* shell: side menu like the WasteLine demo */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sideW);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px calc(14px + env(safe-area-inset-bottom));z-index:40;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{width:34px;height:34px;color:var(--hud);flex:none}
.brand b{font-family:var(--head);font-size:17px;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:1px}
.side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#C3CCDA;text-decoration:none;font-weight:500;margin-bottom:2px}
.side a.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side a.nav:hover{background:rgba(255,255,255,.04)}
.side a.nav.on{background:rgba(92,200,245,.1);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.side a.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--card2);border-radius:99px;padding:1px 8px;color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 4px 0}
.content{margin-left:var(--sideW);padding:28px 32px 56px;max-width:1380px}
.topbar{display:none}
.scrim{display:none}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.phead h1{font-family:var(--head);font-size:34px;line-height:1.1;margin:6px 0 0;letter-spacing:-.6px;font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .lab{color:#C3CCDA;font-size:14px}
.kpi .sub{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:13px;color:var(--muted)}
.kpi.hi b{color:var(--hud);text-shadow:0 0 18px rgba(92,225,255,.35)}
.kpi .sub.warn{color:var(--warn)}

.dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-family:var(--head);font-size:17px;margin:0;font-weight:700}
.card-h a,.card-h .lnk{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;background:none;padding:0;border:0;cursor:pointer}
.card-h .cnt{color:var(--muted);font-size:13px;font-family:var(--mono)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.lines li:last-child{border-bottom:0}
.lines .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.lines .k{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:rgba(52,211,153,.35)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}
.chip.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}
.chip.hud{color:var(--hud);border-color:rgba(92,225,255,.35)}
.chip.violet{color:var(--violet);border-color:rgba(167,139,250,.35)}
.bar{height:8px;background:#0B1322;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#132036;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:120;max-width:90vw}
.toast.show{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:7px 12px;font-size:13px;font-weight:600}
.chips button.on{color:#fff;border-color:var(--accent);background:rgba(92,200,245,.12)}

/* task cards */
.tc{--st:var(--muted);display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--st);border-radius:12px;background:var(--card2);margin-bottom:8px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.tc:hover,.tc.open{border-color:rgba(92,200,245,.45);border-left-color:var(--st);background:#19263F}
.tc.s-running{--st:var(--hud)}.tc.s-waiting{--st:var(--warn)}.tc.s-scheduled{--st:var(--violet)}.tc.s-done{--st:var(--good)}
.tc .ck{width:24px;height:24px;border-radius:50%;border:2px solid #4A5870;background:transparent;flex:none;padding:0;display:grid;place-items:center;color:#06121F;font-size:14px;font-weight:800;margin-top:1px}
.tc .ck:hover{border-color:var(--good)}
.tc.s-done .ck{background:var(--good);border-color:var(--good)}
.tc .body{flex:1;min-width:0}
.tc .tt{font-weight:600;overflow-wrap:anywhere}
.tc.s-done .tt{color:var(--muted);text-decoration:line-through}
.tc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tc .peek{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.run .stdot{box-shadow:0 0 8px var(--hud);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}

/* task detail card: hover pop on laptop, sheet on phone */
#tdBack{position:fixed;inset:0;background:rgba(3,6,12,.55);z-index:58}
#td{position:fixed;z-index:60;width:390px;max-width:calc(100vw - 24px);max-height:min(76vh,640px);overflow:auto;background:#0F1828;border:1px solid rgba(92,200,245,.4);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:18px;overscroll-behavior:contain}
#td.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;max-height:86vh;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#td .grab{display:none;width:44px;height:5px;border-radius:9px;background:#33415a;margin:-6px auto 12px}
#td.sheet .grab{display:block}
#td .td-h{display:flex;gap:8px;align-items:flex-start}
#td .td-title{flex:1;font-family:var(--head);font-size:18px;font-weight:700;background:transparent;border:1px solid transparent;padding:4px 6px;margin:-4px 0 0 -6px}
#td .td-title:hover{border-color:var(--line)}
#td .td-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
#td .td-meta select,#td .td-meta input{width:100%;padding:8px 10px;font-size:14px}
#td h4{margin:16px 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:var(--mono);display:flex;justify-content:space-between;align-items:center}
#td .desc{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#D5DDEA}
#td .desc ul{margin:4px 0;padding-left:18px;white-space:normal}
#td .desc li{margin:3px 0}
#td .note{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;white-space:pre-wrap;position:relative}
#td .note time{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#td .note .x{position:absolute;top:4px;right:2px}
#td .td-f{display:flex;gap:8px;margin-top:16px}

/* rings and charts */
.ringcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ringcard svg{width:132px;height:132px;flex:none}
.ringcard .rl{flex:1;min-width:150px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.bars div{flex:1;background:linear-gradient(180deg,var(--accent),rgba(92,200,245,.25));border-radius:5px 5px 2px 2px;min-height:2px;position:relative}
.bars div.today{background:linear-gradient(180deg,var(--hud),rgba(92,225,255,.4));box-shadow:0 0 12px rgba(92,225,255,.4)}
.barlab{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono)}
.chart svg{width:100%;height:150px;display:block}

/* deals */
.deal{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.deal b{display:block}
.deal select{padding:4px 8px;font-size:12px;margin-top:8px}

/* plan */
.plan label{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.plan label:last-child{border-bottom:0}
.plan label input{width:20px;height:20px;accent-color:var(--good);padding:0;flex:none}
.plan label .grow{flex:1;min-width:0}
.plan label.done .grow{color:var(--muted);text-decoration:line-through}
.plan h3{font-size:14px;margin:14px 0 4px}

/* misc v2 */
.chat{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:#06121F}
.msg.ai{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cal div.on{background:var(--accent);color:#06121F;font-weight:700}
.cal div.today{outline:1px solid var(--warn)}

/* login + lock */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#lock .card{align-items:center;text-align:center;background:transparent;border:0}
#lock .logo{width:72px;height:72px;color:var(--hud)}
#pinTitle{font-family:var(--head);font-size:20px;margin:8px 0 0}
.dots{display:flex;gap:14px;margin:14px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hud);display:block}
.dots i.on{background:var(--hud);box-shadow:0 0 10px var(--hud)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:10px}
.pad button{height:72px;border-radius:50%;background:rgba(92,225,255,.06);border:1px solid rgba(92,225,255,.25);color:var(--text);font-size:24px;font-weight:500;font-family:var(--mono)}
.pad button:active{background:rgba(92,225,255,.2)}
.pad button.blank{visibility:hidden}
.pad button.fn{font-size:13px;background:transparent;border-color:transparent;color:var(--muted)}

/* boot */
#boot{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#0b1a30 0%,#05080F 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,26px);padding:24px 16px calc(24px + env(safe-area-inset-bottom));cursor:pointer;overflow:hidden;transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
#boot::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(92,225,255,.035) 0 1px,transparent 1px 4px);pointer-events:none}
#boot .mono{width:clamp(96px,22vw,150px);height:auto;overflow:visible}
#boot .car{width:min(560px,92vw);height:auto;overflow:visible}
.mono .ring{fill:none;stroke:var(--hud);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(92,225,255,.7))}
.mono .ring2{fill:none;stroke:rgba(92,225,255,.35);stroke-width:1;opacity:0}
.mono .sig{fill:none;stroke:#EAF8FF;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 4px rgba(92,225,255,.6))}
.mono .sweep{opacity:0}
.car .body,.car .win,.car .wheel,.car .hub,.car .haunch,.car .lamp{fill:none;stroke:var(--hud);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.car .body{stroke-width:3;filter:drop-shadow(0 0 6px rgba(92,225,255,.8))}
.car .win{stroke-width:2;stroke:rgba(92,225,255,.8)}
.car .haunch{stroke-width:2;stroke:rgba(92,225,255,.7)}
.car .lamp{stroke-width:2}
.car .wheel{stroke-width:3}
.car .hub{stroke-width:1.5;stroke:rgba(92,225,255,.6)}
.car .ground{stroke:rgba(92,225,255,.25);stroke-width:1;stroke-dasharray:2 6;opacity:0}
#boot.go .mono .ring{animation:draw .6s ease-out forwards}
#boot.go .mono .ring2{animation:fade .5s .35s forwards}
#boot.go .mono .sig{animation:draw .75s .2s ease-in-out forwards}
#boot.go .mono .sweep{animation:sweep .7s .95s ease-in-out forwards}
#boot.go .car .body{animation:draw 1.25s 1.25s cubic-bezier(.55,.1,.35,1) forwards}
#boot.go .car .lamp{animation:draw .35s 2.25s ease-out forwards}
#boot.go .car .win{animation:draw .45s 2.2s ease-out forwards}
#boot.go .car .haunch{animation:draw .45s 2.3s ease-out forwards}
#boot.go .car .wheel{animation:draw .5s 2.3s ease-out forwards}
#boot.go .car .hub{animation:draw .4s 2.55s ease-out forwards}
#boot.go .car .ground{animation:fade .6s 1.3s forwards}
#boot.go .hudrow > div{animation:rise .5s ease-out forwards}
#boot.go .hudrow > div:nth-child(1){animation-delay:1.25s}
#boot.go .hudrow > div:nth-child(2){animation-delay:1.35s}
#boot.go .hudrow > div:nth-child(3){animation-delay:1.45s}
#boot.go .hudrow > div:nth-child(4){animation-delay:1.55s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes sweep{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(300px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hudrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(720px,100%)}
.hudrow > div{opacity:0;border:1px solid rgba(92,225,255,.25);background:rgba(92,225,255,.04);border-radius:10px;padding:10px 12px;min-width:0}
.hudrow b{display:block;font-family:var(--mono);font-size:clamp(18px,4.6vw,26px);color:var(--hud);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 12px rgba(92,225,255,.45)}
.hudrow span{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:var(--mono)}
.hudrow small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
#boot .skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);margin:0}
#boot .hello{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin:0;opacity:0;text-align:center}
#boot.go .hello{animation:fade .5s .6s forwards}
#boot.still *{animation:none!important}
#boot.still .mono .ring,#boot.still .mono .sig,#boot.still .car .body,#boot.still .car .win,#boot.still .car .wheel,#boot.still .car .hub,#boot.still .car .haunch,#boot.still .car .lamp{stroke-dashoffset:0}
#boot.still .mono .ring2,#boot.still .car .ground,#boot.still .hello,#boot.still .hudrow > div{opacity:1}
@media (prefers-reduced-motion: reduce){#boot *{animation:none!important;transition:none!important}.chip.run .stdot{animation:none}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .side{transform:translateX(-105%);transition:transform .22s ease;width:min(290px,86vw);box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:90}
  body.menu .side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(3,6,12,.6);z-index:80}
  .content{margin-left:0;padding:16px 16px 48px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(10,15,26,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .topbar svg.logo{width:30px;height:30px;color:var(--hud)}
  .topbar b{font-family:var(--head);font-size:16px}
  .topbar .sp{flex:1}
  .topbar button{padding:8px 10px}
  .dash{grid-template-columns:minmax(0,1fr)}
  .phead h1{font-size:26px}
  .phead > button{display:none}
}
@media (max-width:520px){
  .kpis{gap:10px;margin-bottom:12px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:22px}
  .kpi .lab{font-size:13px}
  .kpi .sub{margin-top:8px;padding-top:7px;font-size:12px}
  .phead{margin-bottom:14px}
  .quick{flex-wrap:wrap}
  .quick input{flex:1 1 100%}
  .quick select{flex:1;max-width:none!important}
  .card{padding:16px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* The anon key is public by design (it only identifies the project). All hq_ data sits behind owner-only RLS. No secret keys here. */
const SB_URL = "https://iyxsehwyvriujaixnwow.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5eHNlaHd5dnJpdWphaXhud293Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDMyMjUsImV4cCI6MjEwODY3OTIyNX0.ml5pPjC3HkCawtkDs0NdeK_Iubdj82j80hjFMFEBWNU";
const sb = supabase.createClient(SB_URL, SB_KEY);
const CHANNELS = [["email","Email"],["linkedin","LinkedIn"],["calls","Calls"],["other","Other"]];
const PROJECTS = ["ApexLine","Workshop","WasteLine","WasteHub wind-down","Personal admin"];
const STATUSES = [["todo","To do"],["running","Running"],["waiting","Waiting"],["scheduled","Scheduled"],["done","Done"]];
const STAGES = ["Lead","Spoken","Demo booked","Demo done","Proposal sent","Won","Building","Live","Lost"];
const OPEN_STAGES = ["Lead","Spoken","Demo booked","Demo done","Proposal sent"];
const SIGNED_STAGES = ["Won","Building","Live"];
const PIN_ITER = 210000, PIN_MAX_FAILS = 5, LOCK_AFTER_MS = 5 * 60 * 1000;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const today = () => iso(new Date());
const addDays = (d, n) => iso(new Date(new Date(d + "T12:00:00").getTime() + n * 864e5));
const gbp = n => "£" + Math.round(Number(n || 0)).toLocaleString("en-GB");
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const sum = (rows, f) => rows.reduce((a, r) => a + Number(r[f] || 0), 0);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const canHover = () => matchMedia("(hover: hover) and (pointer: fine)").matches;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400); }
async function q(p){ const { data, error } = await p; if (error) { toast(error.message); throw error; } return data; }
function show(id){ ["login","lock","boot","app"].forEach(x => $("#" + x).classList.toggle("hide", x !== id)); if (id !== "app") closeTask(); }

/* ---------- state ---------- */
let ME = null, appStarted = false, hiddenAt = 0;
const S = { tasks: [], notes: [], deals: [], invoices: [], cash: [], debts: [], plan: [], outreach: [], settings: { target: 25000, deadline: "2026-12-31", title: "Road to £25k" } };
async function loadAll(){
  const since = addDays(today(), -13);
  const [tasks, notes, deals, invoices, cash, debts, plan, outreach, st] = await Promise.all([
    q(sb.from("hq_tasks").select("*").order("sort")),
    q(sb.from("hq_task_notes").select("*").order("created_at")),
    q(sb.from("hq_deals").select("*").order("created_at")),
    q(sb.from("hq_invoices").select("*").order("number")),
    q(sb.from("hq_cash").select("*").order("date", { ascending: false })),
    q(sb.from("hq_debts").select("*").order("created_at")),
    q(sb.from("hq_debt_plan").select("*").order("sort")),
    q(sb.from("hq_outreach").select("*").gte("day", since)),
    q(sb.from("hq_settings").select("*").limit(1)),
  ]);
  Object.assign(S, { tasks, notes, deals, invoices, cash, debts, plan, outreach });
  if (st && st[0]) S.settings = st[0];
  return S;
}

/* ---------- money rules ----------
   MRR = monthly fees from signed customers (Jack, 18 Nov: George's £199 counts from signing). Each month opens at MRR.
   Won = contract value signed this month. Cash collected = money banked; only this counts to £25k.
   Invoiced, not paid = shown apart, never counted as cash. */
function money(s = S, d = today()){
  const m = d.slice(0, 7);
  const counted = s.cash.filter(c => c.counts);
  const sent = s.invoices.filter(i => i.status === "sent");
  const scheduled = s.invoices.filter(i => i.status === "scheduled");
  const signed = s.deals.filter(x => SIGNED_STAGES.includes(x.stage));
  const notLive = signed.filter(x => x.stage !== "Live" && Number(x.monthly));
  const target = Number(s.settings.target || 25000);
  const cashTotal = sum(counted, "amount");
  return {
    mrr: sum(signed, "monthly"),
    liveMrr: sum(s.deals.filter(x => x.stage === "Live"), "monthly"),
    nextLive: notLive.map(x => x.live_on).filter(Boolean).sort()[0] || null,
    customers: signed.filter(x => Number(x.monthly)).length,
    won: sum(s.deals.filter(x => x.won_on && x.won_on.slice(0, 7) === m && x.stage !== "Lost"), "value"),
    cashMonth: sum(counted.filter(c => String(c.date).slice(0, 7) === m), "amount"),
    cashTotal,
    unpaid: sum(sent, "amount"), unpaidCount: sent.length,
    scheduled: sum(scheduled, "amount"),
    pipeline: sum(s.deals.filter(x => OPEN_STAGES.includes(x.stage)), "value"),
    openDeals: s.deals.filter(x => OPEN_STAGES.includes(x.stage)).length,
    debtsLeft: s.debts.reduce((a, r) => a + Math.max(0, Number(r.amount) - Number(r.paid)), 0),
    target, pct: Math.min(100, Math.round(100 * cashTotal / (target || 1))),
  };
}

/* ---------- tasks helpers ---------- */
const ORD = { running: 0, todo: 1, waiting: 2, scheduled: 3, done: 4 };
const doneDay = t => t.done_at ? iso(t.done_at) : null;
function todayTasks(s = S, d = today()){
  return s.tasks.filter(t =>
      (t.status === "done" && doneDay(t) === d) ||
      (t.status !== "done" && t.due && t.due <= d) ||
      (t.status === "running") ||
      (t.status === "waiting" && !t.due))
    .sort((a, b) => (ORD[a.status] - ORD[b.status]) || String(a.due_time || "99").localeCompare(String(b.due_time || "99")) || a.sort - b.sort);
}
function todayCounts(s = S, d = today()){
  const all = todayTasks(s, d), open = all.filter(t => t.status !== "done");
  return { total: all.length, open: open.length, calls: open.filter(t => /call|demo/i.test(t.title)).length, done: all.length - open.length };
}
function statusChip(t){
  if (t.status === "running") return `<span class="chip hud run"><span class="stdot"></span>Running</span>`;
  if (t.status === "waiting") return `<span class="chip warn">Waiting on ${esc(t.waiting_on || "Jack")}</span>`;
  if (t.status === "scheduled") return `<span class="chip violet">Scheduled</span>`;
  if (t.status === "done") return `<span class="chip good">Done</span>`;
  return `<span class="chip">To do</span>`;
}
function dueChip(t, d = today()){
  if (!t.due) return "";
  const tm = t.due_time ? " " + String(t.due_time).slice(0, 5) : "";
  if (t.status !== "done" && t.due < d) { const n = Math.round((new Date(d) - new Date(t.due)) / 864e5); return `<span class="chip bad">Overdue ${n}d</span>`; }
  if (t.due === d) return `<span class="chip hud">Today${tm}</span>`;
  if (t.due === addDays(d, 1)) return `<span class="chip">Tomorrow${tm}</span>`;
  return `<span class="chip">${fmtDay(t.due)}${tm}</span>`;
}
const notesFor = id => S.notes.filter(n => n.task_id === id);
function taskCard(t, opts = {}){
  const n = notesFor(t.id).length, first = (t.notes || "").split("\n").find(l => l.trim()) || "";
  return `<div class="tc s-${t.status}" data-id="${t.id}" tabindex="0">
    <button class="ck" data-act="tick" aria-label="${t.status === "done" ? "Mark not done" : "Mark done"}">${t.status === "done" ? "✓" : ""}</button>
    <div class="body">
      <div class="tt">${esc(t.title)}</div>
      ${first && !opts.compact ? `<div class="peek">${esc(first)}</div>` : ""}
      <div class="meta">${statusChip(t)}${opts.today && t.due === today() && !t.due_time ? "" : dueChip(t)}${opts.project ? `<span class="chip">${esc(t.project)}</span>` : ""}${n ? `<span class="chip">${n} ${n === 1 ? "note" : "notes"}</span>` : ""}${t.source === "claude" ? '<span class="chip violet">Claude</span>' : ""}</div>
    </div></div>`;
}
async function setTask(t, v){
  await q(sb.from("hq_tasks").update(v).eq("id", t.id)); Object.assign(t, v);
}
async function toggleDone(t){
  const v = t.status === "done" ? { status: "todo", done_at: null } : { status: "done", done_at: new Date().toISOString() };
  await setTask(t, v); toast(v.status === "done" ? "Done: " + t.title : "Back on the list");
  rerender();
}
async function addTask(row){
  row.sort = Math.max(0, ...S.tasks.map(t => t.sort || 0)) + 1;
  if (row.status === "waiting" && !row.waiting_on) row.waiting_on = "Jack";
  const created = await q(sb.from("hq_tasks").insert(row).select().single());
  S.tasks.push(created); toast("Added: " + row.title); return created;
}

/* task cards: tick button, click or tap opens the detail card, hover previews it on a laptop */
const TD = { id: null, pinned: false, hoverT: 0, leaveT: 0, editDesc: false };
document.addEventListener("click", async e => {
  const ck = e.target.closest(".tc [data-act=tick]");
  if (ck) { e.stopPropagation(); const t = S.tasks.find(x => x.id === ck.closest(".tc").dataset.id); if (t) await toggleDone(t); return; }
  const tc = e.target.closest(".tc");
  if (tc) { openTask(tc.dataset.id, tc, true); return; }
  if (!e.target.isConnected) return; // the card redrew itself under this click (e.g. Edit), so it was inside
  if (TD.id && !e.target.closest("#td") && !e.target.closest("#tdBack")) closeTask();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && TD.id) return closeTask();
  const tc = e.target.closest && e.target.closest(".tc");
  if (tc && e.key === "Enter" && e.target === tc) openTask(tc.dataset.id, tc, true);
});
document.addEventListener("mouseover", e => {
  if (!canHover()) return;
  const tc = e.target.closest(".tc"), inTd = e.target.closest("#td");
  if (inTd || (tc && tc.dataset.id === TD.id)) { clearTimeout(TD.leaveT); return; }
  if (tc) { clearTimeout(TD.hoverT); TD.hoverT = setTimeout(() => { if (!TD.pinned) openTask(tc.dataset.id, tc, false); }, 320); }
});
document.addEventListener("mouseout", e => {
  if (!canHover()) return;
  const from = e.target.closest(".tc, #td"), to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".tc, #td");
  if (from && from.classList.contains("tc")) clearTimeout(TD.hoverT);
  if (from && from !== to && TD.id && !TD.pinned) { clearTimeout(TD.leaveT); TD.leaveT = setTimeout(() => { if (!TD.pinned) closeTask(); }, 260); }
});
$("#td").addEventListener("focusin", () => { TD.pinned = true; });
$("#tdBack").onclick = () => closeTask();
function openTask(id, anchor, pin){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const same = TD.id === id;
  if (!same) TD.editDesc = false;
  TD.pinned = (same && TD.pinned) || !!pin; TD.id = id;
  document.querySelectorAll(".tc.open").forEach(x => x.classList.remove("open"));
  if (anchor) anchor.classList.add("open");
  drawTask();
  const td = $("#td"); td.classList.remove("hide");
  const sheet = !canHover() || innerWidth < 700;
  td.classList.toggle("sheet", sheet);
  $("#tdBack").classList.toggle("hide", !sheet);
  if (!sheet && anchor) {
    const r = anchor.getBoundingClientRect(), w = Math.min(390, innerWidth - 24), h = td.offsetHeight;
    let left = r.right + 12; if (left + w > innerWidth - 12) left = Math.max(12, r.left - w - 12);
    if (left < 12 || (r.left - w - 12 < 12 && r.right + 12 + w > innerWidth - 12)) left = Math.max(12, Math.min(innerWidth - w - 12, r.left));
    let top = Math.min(Math.max(12, r.top - 8), innerHeight - h - 12);
    td.style.left = left + "px"; td.style.top = Math.max(12, top) + "px";
  }
}
function closeTask(){
  TD.id = null; TD.pinned = false; TD.editDesc = false; clearTimeout(TD.hoverT); clearTimeout(TD.leaveT);
  const td = $("#td"); if (!td) return; td.classList.add("hide"); td.innerHTML = ""; $("#tdBack").classList.add("hide");
  document.querySelectorAll(".tc.open").forEach(x => x.classList.remove("open"));
}
function fmtDesc(s){
  if (!s) return '<span class="muted">No description yet.</span>';
  const out = []; let list = [];
  const flush = () => { if (list.length) { out.push("<ul>" + list.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>"); list = []; } };
  s.split("\n").forEach(l => { const m = l.match(/^\s*[-*•]\s+(.*)/); if (m) list.push(m[1]); else { flush(); out.push(esc(l)); } });
  flush(); return out.join("\n").replace(/\n(<ul>)/g, "$1").replace(/(<\/ul>)\n/g, "$1");
}
function drawTask(){
  const t = S.tasks.find(x => x.id === TD.id); if (!t) return closeTask();
  const notes = notesFor(t.id);
  const td = $("#td");
  td.innerHTML = `<div class="grab"></div>
    <div class="td-h"><input class="td-title" id="tdTitle" value="${esc(t.title)}" aria-label="Task title"><button class="x" id="tdClose" aria-label="Close">✕</button></div>
    <div>${statusChip(t)} ${dueChip(t)} ${t.source === "claude" ? '<span class="chip violet">Claude</span>' : ""}</div>
    <div class="td-meta">
      <select id="tdStatus" aria-label="Status">${STATUSES.map(([v, l]) => `<option value="${v}" ${v === t.status ? "selected" : ""}>${l}</option>`).join("")}</select>
      <select id="tdProj" aria-label="Project">${PROJECTS.map(p => `<option ${p === t.project ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
      <input id="tdDue" type="date" value="${t.due || ""}" aria-label="Due date">
      <input id="tdTime" type="time" value="${t.due_time ? String(t.due_time).slice(0, 5) : ""}" aria-label="Time">
    </div>
    <h4>Description <button class="x sm" id="tdEditDesc">${TD.editDesc ? "Done" : "Edit"}</button></h4>
    ${TD.editDesc ? `<textarea id="tdDesc" style="min-height:160px">${esc(t.notes || "")}</textarea>` : `<div class="desc" id="tdDescView">${fmtDesc(t.notes)}</div>`}
    <h4>Notes <span>${notes.length}</span></h4>
    <div id="tdNotes">${notes.map(n => `<div class="note">${esc(n.body)}<time>${new Date(n.created_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</time><button class="x" data-dnote="${n.id}" aria-label="Delete note">✕</button></div>`).join("") || '<p class="muted small" style="margin:0 0 8px">No notes yet.</p>'}</div>
    <textarea id="tdNote" placeholder="Add a note (call answers, next step, anything)"></textarea>
    <div class="td-f"><button id="tdNoteSave">Save note</button><span style="flex:1"></span><button class="ghost" id="tdDone">${t.status === "done" ? "Not done" : "Mark done"}</button><button class="ghost" id="tdDel" aria-label="Delete task">Delete</button></div>`;
  $("#tdClose").onclick = closeTask;
  const save = async v => { await setTask(t, v); rerender(); drawTask(); };

async function signOut(msg){ try { await sb.auth.signOut(); } catch {} ME = null; appStarted = false; showLogin(msg); }

async function pinRow(){ const r = await q(sb.from("hq_pin").select("*").limit(1)); return r[0] || null; }
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pinDerive(pin, salt, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin + ":" + ME.id), "PBKDF2", false, ["deriveBits"]);
  return b64e(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, key, 256));
}
async function pinMake(pin){ const salt = crypto.getRandomValues(new Uint8Array(16)); return `pbkdf2-sha256$${PIN_ITER}$${b64e(salt)}$${await pinDerive(pin, salt, PIN_ITER)}`; }
async function pinCheck(pin, stored){
  const [, iter, salt, hash] = String(stored).split("$");
  const got = await pinDerive(pin, b64d(salt), Number(iter));
  let diff = got.length ^ hash.length; for (let i = 0; i < Math.min(got.length, hash.length); i++) diff |= got.charCodeAt(i) ^ hash.charCodeAt(i);
  return diff === 0;
}
const PIN = { mode: "enter", entry: "", first: "", busy: false };
function showLock(mode){
  PIN.mode = mode; PIN.entry = ""; PIN.first = "";
  $("#pinTitle").textContent = mode === "set" ? "Choose a 4 digit PIN" : "Enter PIN";
  $("#pinMsg").textContent = mode === "set" ? "Opens HQ on this device from now on." : "";
  $("#pinForgot").classList.toggle("hide", mode === "set");
  document.body.classList.remove("menu");
  drawDots(); show("lock");
}
function drawDots(){ $("#pinDots").innerHTML = [0,1,2,3].map(i => `<i class="${i < PIN.entry.length ? "on" : ""}"></i>`).join(""); }
function pinFail(msg){ PIN.entry = ""; drawDots(); $("#pinMsg").textContent = msg; const d = $("#pinDots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); }
$("#pinPad").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","del"].map(k => k === "" ? `<button class="blank" tabindex="-1" aria-hidden="true"></button>` : k === "del" ? `<button class="fn" data-k="del" aria-label="Delete">Delete</button>` : `<button data-k="${k}">${k}</button>`).join("");
$("#pinPad").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pinKey(b.dataset.k); });
document.addEventListener("keydown", e => {
  if ($("#lock").classList.contains("hide")) return;
  if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === "Backspace") pinKey("del");
});
$("#pinForgot").onclick = () => signOut("Sign in with your password, then choose a PIN if you want a new one.");
async function pinKey(k){
  if (PIN.busy) return;
  if (k === "del") { PIN.entry = PIN.entry.slice(0, -1); return drawDots(); }
  if (PIN.entry.length >= 4) return;
  PIN.entry += k; drawDots();
  if (PIN.entry.length < 4) return;
  PIN.busy = true;
  try {
    if (PIN.mode === "set") {
      if (!PIN.first) { PIN.first = PIN.entry; PIN.entry = ""; $("#pinTitle").textContent = "Confirm PIN"; $("#pinMsg").textContent = ""; drawDots(); return; }
      if (PIN.first !== PIN.entry) { PIN.first = ""; $("#pinTitle").textContent = "Choose a 4 digit PIN"; return pinFail("Didn't match. Try again."); }
      const pin_hash = await pinMake(PIN.entry);
      await q(sb.from("hq_pin").upsert({ owner: ME.id, pin_hash }, { onConflict: "owner" }));
      store.del("hq.pinFails"); toast("PIN set"); unlockAndBoot();
    } else {
      const row = await pinRow();
      if (!row) return showLock("set");
      if (await pinCheck(PIN.entry, row.pin_hash)) { store.del("hq.pinFails"); unlockAndBoot(); }
      else {
        const fails = Number(store.get("hq.pinFails") || 0) + 1; store.set("hq.pinFails", String(fails));
        if (fails >= PIN_MAX_FAILS) { store.del("hq.pinFails"); return signOut("Too many wrong PINs. Sign in with your password."); }
        pinFail(`Wrong PIN. ${PIN_MAX_FAILS - fails} ${PIN_MAX_FAILS - fails === 1 ? "try" : "tries"} left.`);
      }
    }
  } catch (err) { pinFail("Couldn't check the PIN: " + (err.message || err)); }
  finally { PIN.busy = false; }
}
$("#lockBtn").onclick = () => showLock("enter");
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!ME || !appStarted || $("#app").classList.contains("hide")) return;
  if (hiddenAt && Date.now() - hiddenAt > LOCK_AFTER_MS) return showLock("enter");
  refresh();
});

/* boot: monogram + sweep, car draws while the HUD counts up. Tap skips. Reduced motion shows the finished frame. */
const BOOT = { timer: 0, raf: 0, done: null, ended: false };
function hudTiles(s){
  const m = money(s), c = todayCounts(s);
  return [
    { v: m.mrr, label: "MRR", sub: m.nextLive && !m.liveMrr ? "starts " + fmtDay(m.nextLive) : m.customers + (m.customers === 1 ? " customer" : " customers") },
    { v: m.cashMonth, label: "Cash this month", sub: m.unpaid ? "of " + gbp(m.unpaid) + " invoiced" : "no invoices unpaid" },
    { v: m.pipeline, label: "Pipeline", sub: m.openDeals + " open " + (m.openDeals === 1 ? "deal" : "deals") },
    { v: c.open, label: "Today", sub: c.open + " tasks, " + c.calls + (c.calls === 1 ? " call" : " calls"), plain: true },
  ];
}
function drawHud(tiles, frac){
  // tiles are built once per boot so their fade-in runs once; each frame only the numbers change
  const box = $("#bootHud"), e = 1 - Math.pow(1 - frac, 3);
  if (box.children.length !== tiles.length) box.innerHTML = tiles.map(() => `<div><span></span><b></b><small></small></div>`).join("");
  tiles.forEach((t, i) => {
    const el = box.children[i];
    el.children[0].textContent = t.label;
    el.children[1].textContent = t.plain ? Math.round(t.v * e) : gbp(t.v * e);
    el.children[2].textContent = t.sub;
  });
}
function greet(){ const h = new Date().getHours(); return h < 12 ? "Morning" : h < 18 ? "Afternoon" : "Evening"; }
function unlockAndBoot(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const boot = $("#boot");
  BOOT.ended = false; boot.className = ""; show("boot");
  $("#bootHello").textContent = greet() + " Jack. Systems online.";
  drawHud(hudTiles(S), 0);
  const data = loadAll().catch(() => S);
  let tiles = null; data.then(s => { tiles = hudTiles(s); });
  const finish = () => {
    if (BOOT.ended) return; BOOT.ended = true;
    clearTimeout(BOOT.timer); cancelAnimationFrame(BOOT.raf);
    boot.classList.add("still");
    data.then(s => { drawHud(hudTiles(s), 1); boot.classList.add("out"); setTimeout(() => { boot.className = "hide"; startApp(); }, reduce ? 0 : 320); });
  };
  BOOT.done = finish;
  if (reduce) { boot.classList.add("still"); data.then(s => drawHud(hudTiles(s), 1)); BOOT.timer = setTimeout(finish, 1200); return; }
  void boot.offsetWidth; boot.classList.add("go");
  const t0 = performance.now(), countStart = 1250, countLen = 1750;
  const tick = now => {
    const el = now - t0;
    if (el >= countStart && tiles) drawHud(tiles, Math.min(1, (el - countStart) / countLen));
    if (el < countStart + countLen) BOOT.raf = requestAnimationFrame(tick);
  };
  BOOT.raf = requestAnimationFrame(tick);
  BOOT.timer = setTimeout(finish, 3500);
}
$("#boot").addEventListener("click", () => BOOT.done && BOOT.done());
document.addEventListener("keydown", () => { if (!$("#boot").classList.contains("hide") && BOOT.done) BOOT.done(); });

/* ---------- MONEY ---------- */
function cashChart(d){
  const m = d.slice(0, 7), first = m + "-01", n = Number(d.slice(8));
  const byDay = Array.from({ length: n }, (_, i) => { const day = addDays(first, i); return S.cash.filter(c => c.counts && c.date === day).reduce((a, c) => a + Number(c.amount), 0); });
  let run = 0; const cum = byDay.map(v => (run += v));
  const max = Math.max(1000, ...cum), W = 600, H = 150;
  const pts = cum.map((v, i) => [n === 1 ? W : (i / (n - 1)) * W, H - 10 - (v / max) * (H - 24)]);
  const line = pts.map(p => p.map(x => x.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cash banked this month"><defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5CC8F5" stop-opacity=".35"/><stop offset="1" stop-color="#5CC8F5" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="#1F2B40" stroke-dasharray="4 6"/>`).join("")}
    <polygon points="0,${H} ${line} ${W},${H}" fill="url(#cg)"/><polyline points="${line}" fill="none" stroke="#5CC8F5" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- TRAINING (v2) ---------- */
async function exercises(){
  const rows = await q(sb.from("hq_sets").select("exercise").order("created_at", { ascending: false }).limit(500));
  return [...new Set(rows.map(r => r.exercise.trim()))];
}
async function workoutFor(day, create){
  const rows = await q(sb.from("hq_workouts").select("*").eq("day", day).order("created_at").limit(1));
  if (rows[0] || !create) return rows[0] || null;
  return (await q(sb.from("hq_workouts").insert({ day }).select().single()));
}
function setTxt(s){ return (s.weight_kg != null ? Number(s.weight_kg) + "kg" : "BW") + (s.reps != null ? " × " + s.reps : ""); }
function groupSets(sets){
  const m = new Map(); sets.forEach(s => { const k = s.exercise.trim(); if (!m.has(k)) m.set(k, []); m.get(k).push(s); });
  return [...m].map(([ex, sets]) => ({ ex, sets }));
}

function outreachForm(box, rows){
  const by = Object.fromEntries(rows.map(r => [r.channel, r]));
  box.innerHTML = `<table><tr><th>Channel</th><th>Sent</th><th>Acc.</th><th>Replies</th><th>Pers.</th><th>Demos</th></tr>${CHANNELS.map(([c, label]) => { const r = by[c] || {}; return `<tr data-ch="${c}"><td>${label}</td>${["sent","accepted","replies","personalised","demos"].map(f => `<td><input type="number" inputmode="numeric" min="0" data-f="${f}" value="${r[f] ?? ""}" style="width:56px;padding:8px 6px"></td>`).join("")}</tr>`; }).join("")}</table>`;
}
async function saveOutreach(box, day){
  const rows = [...box.querySelectorAll("tr[data-ch]")].map(tr => { const o = { day, channel: tr.dataset.ch }; tr.querySelectorAll("input").forEach(i => o[i.dataset.f] = parseInt(i.value || "0", 10)); return o; }).filter(o => o.sent || o.accepted || o.replies || o.personalised || o.demos);
  if (!rows.length) return toast("Nothing to save");
  await q(sb.from("hq_outreach").upsert(rows, { onConflict: "owner,day,channel" }));
  toast("Outreach saved"); await loadAll();
}
async function renderOutreach(el, day){
  const d = day || renderOutreach.day || today(); renderOutreach.day = d;
  const t7 = S.outreach.filter(r => r.day > addDays(today(), -7));
  const tot = f => t7.reduce((a, r) => a + Number(r[f] || 0), 0);
  el.innerHTML = phead("Last 7 days", "Outreach", `<input id="oDay" type="date" value="${d}" aria-label="Day">`) +
  `<div class="kpis">${kpi(tot("sent"), "Sent", "all channels")}${kpi(tot("accepted"), "Accepted", tot("sent") ? Math.round(100 * tot("accepted") / tot("sent")) + "% of sent" : "-")}${kpi(tot("replies"), "Replies", tot("sent") ? Math.round(100 * tot("replies") / tot("sent")) + "% of sent" : "-")}${kpi(tot("demos"), "Demos", "booked", { hi: true })}</div>
  <div class="dash"><div class="col"><div class="card"><div class="card-h"><h2>Log ${fmtDay(d)}</h2></div><div id="oForm" class="tablewrap"></div><div class="row" style="margin-top:12px"><button id="oSave">Save</button></div></div></div>
  <div class="col"><div class="card"><div class="card-h"><h2>By week</h2></div><div id="oWeeks" class="tablewrap"></div></div></div></div>`;
  $("#oDay").onchange = e => renderOutreach(el, e.target.value);
  const [rows, weeks] = await Promise.all([
    q(sb.from("hq_outreach").select("*").eq("day", d)),
    q(sb.from("hq_v_outreach_week").select("*").order("week", { ascending: false }).limit(40)),
  ]);
  outreachForm($("#oForm"), rows);
  $("#oSave").onclick = () => saveOutreach($("#oForm"), d).then(() => renderOutreach(el, d));
  $("#oWeeks").innerHTML = weeks.length ? `<table><tr><th>Week of</th><th>Channel</th><th>Sent</th><th>Acc %</th><th>Reply %</th><th>Demos</th></tr>${weeks.map(w => `<tr><td>${fmtDay(w.week)}</td><td>${esc((CHANNELS.find(c => c[0] === w.channel) || [0, w.channel])[1])}</td><td>${w.sent}</td><td>${w.accept_pct ?? "-"}</td><td>${w.reply_pct ?? "-"}</td><td>${w.demos}</td></tr>`).join("")}</table>` : `<p class="muted small">Weekly totals show here once you log a day.</p>`;
}

/* ---------- NOTES (v2) ---------- */
const chatLog = [];
async function callAI(payload){
  const { data, error } = await sb.functions.invoke("hq-ai", { body: payload });
  if (error) throw error; if (data && data.error) throw new Error(data.error); return data;
}
async function renderNotes(el){
  el.innerHTML = phead("Brain dumps, lessons, ideas", "Notes") +
  `<div class="dash"><div class="col">
  <div class="card"><div class="card-h"><h2>Brain dump</h2></div><textarea id="nBody" style="min-height:140px" placeholder="Type or use the mic on your keyboard. Anything: lessons, ideas, frustrations, plans."></textarea>
    <div class="row" style="margin-top:8px"><button id="nSum">Save and summarise</button><button class="ghost" id="nSave">Just save</button></div><div id="nResult" class="small" style="margin-top:10px"></div></div>
  <div class="card"><div class="card-h"><h2>Ask your notes</h2></div><div class="chat" id="cLog"></div><div class="row"><input id="cQ" placeholder="e.g. What have I learned about sales this month?" style="flex:1;min-width:160px"><button id="cGo">Ask</button></div></div>
  </div><div class="col">
  <div class="card"><div class="card-h"><h2>What you've learned</h2></div><div id="nIns" class="muted small">Loading…</div></div>
  <div class="card"><div class="card-h"><h2>Past dumps</h2></div><ul class="lines" id="nList"></ul></div>
  </div></div>`;
  const drawChat = () => { $("#cLog").innerHTML = chatLog.map(m => `<div class="msg ${m.role === "user" ? "me" : "ai"}">${esc(m.content)}</div>`).join(""); $("#cLog").scrollTop = 1e9; };
  drawChat();
  const [ins, notes] = await Promise.all([
    q(sb.from("hq_insights").select("*").order("created_at", { ascending: false }).limit(300)),
    q(sb.from("hq_notes").select("*").order("created_at", { ascending: false }).limit(30)),
  ]);
  const kinds = [["lesson","Lessons"],["value","Values"],["idea","Ideas"],["goal","Goals"]];
  $("#nIns").innerHTML = ins.length ? kinds.map(([k, label]) => { const items = ins.filter(i => i.kind === k); return items.length ? `<h3 style="font-size:13px;margin:10px 0 4px;color:var(--text)">${label}</h3><ul class="lines">${items.map(i => `<li><span class="grow" style="color:var(--text)">${esc(i.text)}</span><button class="x" data-di="${i.id}">✕</button></li>`).join("")}</ul>` : ""; }).join("") : "Lessons, values, ideas and goals from your dumps collect here.";
  $("#nList").innerHTML = notes.length ? notes.map(n => `<li><div class="grow"><div class="muted small">${new Date(n.created_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</div><div>${esc(n.summary || n.body.slice(0, 220) + (n.body.length > 220 ? "…" : ""))}</div></div><button class="x" data-dn="${n.id}">✕</button></li>`).join("") : `<li class="muted small">No dumps yet.</li>`;
  el.querySelectorAll("[data-di]").forEach(b => b.onclick = async () => { await q(sb.from("hq_insights").delete().eq("id", b.dataset.di)); renderNotes(el); });
  el.querySelectorAll("[data-dn]").forEach(b => b.onclick = async () => { if (!confirm("Delete this dump?")) return; await q(sb.from("hq_notes").delete().eq("id", b.dataset.dn)); renderNotes(el); });
  const save = async () => { const body = $("#nBody").value.trim(); if (!body) { toast("Write something first"); return null; } return q(sb.from("hq_notes").insert({ body }).select().single()); };
  $("#nSave").onclick = async () => { if (await save()) { toast("Saved"); renderNotes(el); } };
  $("#nSum").onclick = async () => {
    const b = $("#nSum"); b.disabled = true; b.textContent = "Summarising…";
    try {
      const note = await save(); if (!note) return;
      const r = await callAI({ mode: "summarise", note_id: note.id, text: note.body });
      toast("Summarised"); await renderNotes(el);
      $("#nResult").innerHTML = `<b>Summary:</b> ${esc(r.summary)}`;
    } catch (e) { toast("Saved, but the summary failed: " + e.message); renderNotes(el); }
    finally { b.disabled = false; b.textContent = "Save and summarise"; }
  };
  $("#cGo").onclick = async () => {
    const qn = $("#cQ").value.trim(); if (!qn) return;
    chatLog.push({ role: "user", content: qn }); $("#cQ").value = ""; drawChat();
    try { const r = await callAI({ mode: "chat", question: qn, history: chatLog.slice(0, -1) }); chatLog.push({ role: "assistant", content: r.answer }); }
    catch (e) { chatLog.push({ role: "assistant", content: "Couldn't answer: " + e.message }); }
    drawChat();
  };
  $("#cQ").addEventListener("keydown", e => { if (e.key === "Enter") $("#cGo").click(); });
}

window.HQ = { money, todayTasks, todayCounts, S };
init();
