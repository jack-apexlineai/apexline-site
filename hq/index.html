<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A101C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A101C;--card:#111a2b;--card2:#16213a;--line:#24314d;--text:#EEF2F8;--muted:#9AA7BD;--brand:#3B82F6;--good:#22C55E;--warn:#F59E0B;--bad:#EF4444;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:5;background:rgba(10,16,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:13px;margin-left:auto}
header button{margin-left:8px}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{color:var(--muted);font-size:12px}
input,select,textarea{background:#0d1526;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
textarea{width:100%;min-height:140px;resize:vertical}
input[type=number]{width:90px}
button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.x{background:transparent;color:var(--muted);padding:4px 8px;border:0;font-weight:500}
button:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0b1222;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:10px 4px 12px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav a.on{color:var(--brand)}
nav a i{display:block;font-style:normal;font-size:18px;line-height:1.2}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li .grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cal div.on{background:var(--brand);color:#fff;font-weight:700}
.cal div.today{outline:1px solid var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f1b33;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.chat{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--brand)}
.msg.ai{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.hide{display:none!important}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
#login .card{display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}input[type=number]{width:74px}}
</style>
</head>
<body>

<section id="login" class="hide">
  <div class="card">
    <h2>HQ</h2>
    <p class="muted small">Private. Sign in with your HQ account.</p>
    <input id="lEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="lGo">Sign in</button>
    <p id="lErr" class="small" style="color:var(--bad)"></p>
  </div>
</section>

<div id="app" class="hide">
  <header><h1>HQ</h1><span class="sub" id="hdrSub"></span><button class="ghost small" id="signOut">Sign out</button></header>
  <main>
    <section data-tab="today"></section>
    <section data-tab="health" class="hide"></section>
    <section data-tab="money" class="hide"></section>
    <section data-tab="outreach" class="hide"></section>
    <section data-tab="notes" class="hide"></section>
  </main>
  <nav>
    <a href="#today" data-nav="today"><i>◎</i>Today</a>
    <a href="#health" data-nav="health"><i>▲</i>Health</a>
    <a href="#money" data-nav="money"><i>£</i>Money</a>
    <a href="#outreach" data-nav="outreach"><i>➚</i>Outreach</a>
    <a href="#notes" data-nav="notes"><i>✎</i>Notes</a>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = "https://iyxsehwyvriujaixnwow.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5eHNlaHd5dnJpdWphaXhud293Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDMyMjUsImV4cCI6MjEwODY3OTIyNX0.ml5pPjC3HkCawtkDs0NdeK_Iubdj82j80hjFMFEBWNU";
const sb = supabase.createClient(SB_URL, SB_KEY);
const CHANNELS = [["email","Email"],["linkedin","LinkedIn"],["calls","Calls"],["other","Other"]];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const today = () => iso(new Date());
const gbp = n => "£" + Number(n || 0).toLocaleString("en-GB", { maximumFractionDigits: 0 });
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200); }
async function q(p){ const { data, error } = await p; if (error) { toast(error.message); throw error; } return data; }

/* ---------- auth ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  if (data.session) start(); else { $("#login").classList.remove("hide"); $("#app").classList.add("hide"); }
}
$("#lGo").onclick = async () => {
  $("#lErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lPass").value });
  if (error) { $("#lErr").textContent = error.message; return; }
  $("#login").classList.add("hide"); start();
};
$("#lPass").addEventListener("keydown", e => { if (e.key === "Enter") $("#lGo").click(); });
$("#signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- routing ---------- */
const TABS = { today: renderToday, health: renderHealth, money: renderMoney, outreach: renderOutreach, notes: renderNotes };
function route(){
  const t = (location.hash || "#today").slice(1);
  const tab = TABS[t] ? t : "today";
  document.querySelectorAll("[data-tab]").forEach(s => s.classList.toggle("hide", s.dataset.tab !== tab));
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === tab));
  TABS[tab]($(`[data-tab="${tab}"]`));
  window.scrollTo(0, 0);
}
async function start(){
  $("#app").classList.remove("hide");
  window.addEventListener("hashchange", route);
  const s = await settings();
  const left = Math.max(0, Math.ceil((new Date(s.deadline + "T23:59:59") - new Date()) / 864e5));
  $("#hdrSub").textContent = left + " days to " + fmtDay(s.deadline);
  route();
}

/* ---------- shared data ---------- */
async function settings(){
  const rows = await q(sb.from("hq_settings").select("*").limit(1));
  return rows[0] || { target: 25000, deadline: "2026-12-31", title: "Road to £25k" };
}
async function cashTotal(){
  const rows = await q(sb.from("hq_cash").select("amount,counts"));
  return rows.filter(r => r.counts).reduce((a, r) => a + Number(r.amount), 0);
}
async function exercises(){
  const rows = await q(sb.from("hq_sets").select("exercise").order("created_at", { ascending: false }).limit(500));
  return [...new Set(rows.map(r => r.exercise.trim()))];
}
async function workoutFor(day, create){
  const rows = await q(sb.from("hq_workouts").select("*").eq("day", day).order("created_at").limit(1));
  if (rows[0] || !create) return rows[0] || null;
  return (await q(sb.from("hq_workouts").insert({ day }).select().single()));
}

/* ---------- TODAY ---------- */
async function renderToday(el){
  const d = today();
  el.innerHTML = `<div class="card"><h2>${fmtDay(d)}</h2><div class="grid3" id="tStats"></div></div>
  <div class="card"><h2>Bodyweight</h2><div class="row"><input id="tBw" type="number" step="0.1" inputmode="decimal" placeholder="kg"><button id="tBwSave">Save</button><span class="muted small" id="tBwLast"></span></div></div>
  <div class="card"><h2>Training today</h2><div id="tTrain" class="muted small">Loading…</div><div class="row" style="margin-top:10px"><a href="#health"><button>Log training</button></a></div></div>
  <div class="card"><h2>Outreach today</h2><div id="tOut"></div><div class="row" style="margin-top:10px"><button id="tOutSave">Save outreach</button></div></div>`;
  const [s, cash, bw, wk, out] = await Promise.all([
    settings(), cashTotal(),
    q(sb.from("hq_body").select("day,weight_kg").order("day", { ascending: false }).limit(1)),
    workoutFor(d, false),
    q(sb.from("hq_outreach").select("*").eq("day", d)),
  ]);
  const pct = Math.min(100, Math.round(100 * cash / (s.target || 25000)));
  $("#tStats").innerHTML = `<div class="stat"><b>${gbp(cash)}</b><span>of ${gbp(s.target)} (${pct}%)</span></div>
    <div class="stat"><b>${out.reduce((a, r) => a + r.sent, 0)}</b><span>outreach sent today</span></div>
    <div class="stat"><b>${bw[0] ? bw[0].weight_kg + "kg" : "-"}</b><span>last bodyweight</span></div>`;
  if (bw[0]) $("#tBwLast").textContent = "Last: " + bw[0].weight_kg + "kg on " + fmtDay(bw[0].day);
  $("#tBwSave").onclick = async () => {
    const v = parseFloat($("#tBw").value); if (!v) return toast("Enter a weight");
    await q(sb.from("hq_body").upsert({ day: d, weight_kg: v }, { onConflict: "owner,day" }));
    toast("Saved " + v + "kg"); renderToday(el);
  };
  if (wk) {
    const sets = await q(sb.from("hq_sets").select("*").eq("workout_id", wk.id).order("created_at"));
    $("#tTrain").innerHTML = sets.length ? groupSets(sets).map(g => `<div><b>${esc(g.ex)}</b>: ${g.sets.map(s => setTxt(s)).join(", ")}</div>`).join("") : "Session started, no sets yet.";
  } else $("#tTrain").textContent = "Nothing logged yet today.";
  outreachForm($("#tOut"), out);
  $("#tOutSave").onclick = () => saveOutreach($("#tOut"), d).then(() => renderToday(el));
}
function setTxt(s){ return (s.weight_kg != null ? Number(s.weight_kg) + "kg" : "BW") + (s.reps != null ? " × " + s.reps : ""); }
function groupSets(sets){
  const m = new Map(); sets.forEach(s => { const k = s.exercise.trim(); if (!m.has(k)) m.set(k, []); m.get(k).push(s); });
  return [...m].map(([ex, sets]) => ({ ex, sets }));
}

/* ---------- HEALTH ---------- */
async function renderHealth(el, day){
  const d = day || renderHealth.day || today(); renderHealth.day = d;
  el.innerHTML = `<div class="card"><div class="row"><h2 style="margin:0">Training</h2><input id="hDay" type="date" value="${d}" style="margin-left:auto"></div></div>
  <div class="card"><h2>Add a set</h2>
    <div class="row"><input id="hEx" list="hExList" placeholder="Exercise (e.g. Bench press)" style="flex:1;min-width:180px"><datalist id="hExList"></datalist></div>
    <div class="row" style="margin-top:8px"><input id="hKg" type="number" step="0.5" inputmode="decimal" placeholder="kg"><input id="hReps" type="number" inputmode="numeric" placeholder="reps"><input id="hCount" type="number" inputmode="numeric" placeholder="sets" value="1"><button id="hAdd">Add</button></div>
    <p class="muted small" style="margin:8px 0 0">"sets" adds that many identical sets in one go.</p>
  </div>
  <div class="card"><h2>${fmtDay(d)}</h2><div id="hSets" class="muted small">Loading…</div>
    <div class="row" style="margin-top:10px"><input id="hNotes" placeholder="Session notes (optional)" style="flex:1"><button class="ghost" id="hNotesSave">Save notes</button></div></div>
  <div class="card"><h2>Last 5 weeks</h2><div class="cal" id="hCal"></div></div>
  <div class="card"><h2>Best lifts</h2><ul class="list" id="hBest"></ul></div>
  <div class="card"><h2>Bodyweight</h2><div id="hBw"></div></div>`;
  $("#hDay").onchange = e => renderHealth(el, e.target.value);
  const since = iso(new Date(Date.now() - 34 * 864e5));
  const [exList, wk, cal, best, bw] = await Promise.all([
    exercises(), workoutFor(d, false),
    q(sb.from("hq_workouts").select("day").gte("day", since)),
    q(sb.from("hq_v_best_lifts").select("*").order("exercise")),
    q(sb.from("hq_body").select("day,weight_kg").order("day", { ascending: false }).limit(60)),
  ]);
  $("#hExList").innerHTML = exList.map(x => `<option value="${esc(x)}">`).join("");
  if (wk) $("#hNotes").value = wk.notes || "";
  const sets = wk ? await q(sb.from("hq_sets").select("*").eq("workout_id", wk.id).order("created_at")) : [];
  $("#hSets").innerHTML = sets.length ? `<ul class="list">${groupSets(sets).map(g => `<li><div class="grow"><b>${esc(g.ex)}</b><div class="muted small">${g.sets.map(s => `${setTxt(s)} <button class="x" data-del="${s.id}" title="Delete set">✕</button>`).join(" · ")}</div></div></li>`).join("")}</ul>` : "No sets logged for this day.";
  $("#hSets").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { await q(sb.from("hq_sets").delete().eq("id", b.dataset.del)); renderHealth(el, d); });
  $("#hAdd").onclick = async () => {
    const ex = $("#hEx").value.trim(); if (!ex) return toast("Add the exercise name");
    const kg = $("#hKg").value === "" ? null : parseFloat($("#hKg").value);
    const reps = $("#hReps").value === "" ? null : parseInt($("#hReps").value, 10);
    const n = Math.max(1, Math.min(10, parseInt($("#hCount").value || "1", 10)));
    const w = await workoutFor(d, true);
    const prior = sets.filter(s => s.exercise.trim().toLowerCase() === ex.toLowerCase()).length;
    await q(sb.from("hq_sets").insert(Array.from({ length: n }, (_, i) => ({ workout_id: w.id, exercise: ex, set_no: prior + i + 1, reps, weight_kg: kg }))));
    toast(`Added ${n} × ${ex}`); renderHealth(el, d);
  };
  $("#hNotesSave").onclick = async () => { const w = await workoutFor(d, true); await q(sb.from("hq_workouts").update({ notes: $("#hNotes").value }).eq("id", w.id)); toast("Notes saved"); };
  const trained = new Set(cal.map(r => r.day));
  const start = new Date(Date.now() - 34 * 864e5);
  $("#hCal").innerHTML = Array.from({ length: 35 }, (_, i) => { const x = iso(new Date(start.getTime() + i * 864e5)); return `<div class="${trained.has(x) ? "on" : ""} ${x === today() ? "today" : ""}" title="${x}">${Number(x.slice(8))}</div>`; }).join("");
  $("#hBest").innerHTML = best.length ? best.map(b => `<li><span class="grow">${esc(b.exercise)}</span><b>${Number(b.weight_kg)}kg${b.reps ? " × " + b.reps : ""}</b><span class="muted small">${fmtDay(b.day)}</span></li>`).join("") : `<li class="muted small">Your best lift per exercise shows here once you log sets.</li>`;
  $("#hBw").innerHTML = bw.length ? spark(bw.slice().reverse().map(r => Number(r.weight_kg))) + `<p class="muted small" style="margin:6px 0 0">Latest ${bw[0].weight_kg}kg (${fmtDay(bw[0].day)}), ${bw.length} entries.</p>` : `<p class="muted small">Log bodyweight on the Today tab.</p>`;
}
function spark(vals){
  if (vals.length < 2) return `<p class="small">${vals[0]}kg</p>`;
  const w = 600, h = 120, min = Math.min(...vals) - 0.5, max = Math.max(...vals) + 0.5;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / (max - min)) * h}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px" role="img" aria-label="Bodyweight trend"><polyline fill="none" stroke="#3B82F6" stroke-width="3" points="${pts}"/></svg>`;
}

/* ---------- MONEY ---------- */
async function renderMoney(el){
  const [s, cash, debts] = await Promise.all([
    settings(),
    q(sb.from("hq_cash").select("*").order("date", { ascending: false }).limit(50)),
    q(sb.from("hq_debts").select("*").order("created_at")),
  ]);
  const landed = cash.filter(r => r.counts).reduce((a, r) => a + Number(r.amount), 0);
  const pct = Math.min(100, Math.round(100 * landed / (s.target || 25000)));
  const owed = debts.reduce((a, r) => a + Number(r.amount) - Number(r.paid), 0);
  el.innerHTML = `<div class="card"><h2>${esc(s.title || "Road to £25k")}</h2>
    <div class="grid3"><div class="stat"><b>${gbp(landed)}</b><span>banked toward target</span></div><div class="stat"><b>${gbp(s.target)}</b><span>target by ${fmtDay(s.deadline)}</span></div><div class="stat"><b>${gbp(owed)}</b><span>debts left</span></div></div>
    <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div><p class="muted small" style="margin:6px 0 0">${pct}% there, ${gbp(Math.max(0, s.target - landed))} to go.</p></div>
  <div class="card"><h2>Bank money in</h2>
    <div class="row"><input id="mFrom" placeholder="From (e.g. George)" style="flex:1;min-width:150px"><input id="mAmt" type="number" inputmode="decimal" placeholder="£"></div>
    <div class="row" style="margin-top:8px"><input id="mDate" type="date" value="${today()}"><select id="mSrc"><option>WasteLine</option><option>Custom build</option><option>WasteHub</option><option>Other</option></select><label class="small"><input id="mCounts" type="checkbox" checked> counts to target</label><button id="mAdd">Bank it</button></div></div>
  <div class="card"><h2>Debts</h2><ul class="list" id="mDebts"></ul>
    <div class="row" style="margin-top:10px"><input id="dWho" placeholder="Who (e.g. Ben Lukey)" style="flex:1;min-width:150px"><input id="dAmt" type="number" inputmode="decimal" placeholder="£ owed"><button class="ghost" id="dAdd">Add debt</button></div></div>
  <div class="card"><h2>Money in</h2><ul class="list" id="mCash"></ul></div>
  <div class="card"><h2>Target</h2><div class="row"><input id="sTarget" type="number" value="${s.target}"><input id="sDeadline" type="date" value="${s.deadline}"><button class="ghost" id="sSave">Save</button></div></div>`;
  $("#mDebts").innerHTML = debts.length ? debts.map(r => { const p = Math.min(100, Math.round(100 * r.paid / r.amount)); return `<li><div class="grow"><b>${esc(r.creditor)}</b> <span class="muted small">${gbp(r.paid)} of ${gbp(r.amount)} paid</span><div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div></div><button class="ghost small" data-pay="${r.id}">Pay</button><button class="x" data-dd="${r.id}">✕</button></li>`; }).join("") : `<li class="muted small">No debts added.</li>`;
  $("#mCash").innerHTML = cash.length ? cash.map(r => `<li><span class="grow">${esc(r.from_who)} <span class="pill">${esc(r.source)}</span>${r.counts ? "" : ' <span class="pill">not counted</span>'}</span><b>${gbp(r.amount)}</b><span class="muted small">${fmtDay(r.date)}</span><button class="x" data-dc="${r.id}">✕</button></li>`).join("") : `<li class="muted small">Nothing banked yet.</li>`;
  $("#mAdd").onclick = async () => { const a = parseFloat($("#mAmt").value), f = $("#mFrom").value.trim(); if (!a || !f) return toast("Add who and how much"); await q(sb.from("hq_cash").insert({ from_who: f, amount: Math.round(a), date: $("#mDate").value, source: $("#mSrc").value, counts: $("#mCounts").checked })); toast("Banked " + gbp(a)); renderMoney(el); };
  $("#dAdd").onclick = async () => { const a = parseFloat($("#dAmt").value), w = $("#dWho").value.trim(); if (!a || !w) return toast("Add who and how much"); await q(sb.from("hq_debts").insert({ creditor: w, amount: a })); renderMoney(el); };
  el.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => { const r = debts.find(x => x.id === b.dataset.pay); const v = parseFloat(prompt("Payment to " + r.creditor + " (£)") || ""); if (!v) return; await q(sb.from("hq_debts").update({ paid: Number(r.paid) + v }).eq("id", r.id)); toast("Paid " + gbp(v)); renderMoney(el); });
  el.querySelectorAll("[data-dd]").forEach(b => b.onclick = async () => { if (!confirm("Remove this debt?")) return; await q(sb.from("hq_debts").delete().eq("id", b.dataset.dd)); renderMoney(el); });
  el.querySelectorAll("[data-dc]").forEach(b => b.onclick = async () => { if (!confirm("Remove this payment?")) return; await q(sb.from("hq_cash").delete().eq("id", b.dataset.dc)); renderMoney(el); });
  $("#sSave").onclick = async () => {
    const rows = await q(sb.from("hq_settings").select("id").limit(1));
    const v = { target: parseInt($("#sTarget").value, 10), deadline: $("#sDeadline").value };
    await q(rows[0] ? sb.from("hq_settings").update(v).eq("id", rows[0].id) : sb.from("hq_settings").insert({ ...v, title: "Road to £25k" }));
    toast("Target saved"); renderMoney(el);
  };
}

/* ---------- OUTREACH ---------- */
function outreachForm(box, rows){
  const by = Object.fromEntries(rows.map(r => [r.channel, r]));
  box.innerHTML = `<table><tr><th>Channel</th><th>Sent</th><th>Accepted</th><th>Replies</th><th>Personalised</th><th>Demos</th></tr>${CHANNELS.map(([c, label]) => { const r = by[c] || {}; return `<tr data-ch="${c}"><td>${label}</td>${["sent","accepted","replies","personalised","demos"].map(f => `<td><input type="number" inputmode="numeric" min="0" data-f="${f}" value="${r[f] ?? ""}" style="width:64px"></td>`).join("")}</tr>`; }).join("")}</table>`;
}
async function saveOutreach(box, day){
  const rows = [...box.querySelectorAll("tr[data-ch]")].map(tr => { const o = { day, channel: tr.dataset.ch }; tr.querySelectorAll("input").forEach(i => o[i.dataset.f] = parseInt(i.value || "0", 10)); return o; }).filter(o => o.sent || o.accepted || o.replies || o.personalised || o.demos);
  if (!rows.length) return toast("Nothing to save");
  await q(sb.from("hq_outreach").upsert(rows, { onConflict: "owner,day,channel" }));
  toast("Outreach saved");
}
async function renderOutreach(el, day){
  const d = day || renderOutreach.day || today(); renderOutreach.day = d;
  el.innerHTML = `<div class="card"><div class="row"><h2 style="margin:0">Outreach</h2><input id="oDay" type="date" value="${d}" style="margin-left:auto"></div><div id="oForm" style="margin-top:12px;overflow-x:auto"></div><div class="row" style="margin-top:10px"><button id="oSave">Save</button></div></div>
  <div class="card"><h2>By week</h2><div id="oWeeks" style="overflow-x:auto"></div></div>`;
  $("#oDay").onchange = e => renderOutreach(el, e.target.value);
  const [rows, weeks] = await Promise.all([
    q(sb.from("hq_outreach").select("*").eq("day", d)),
    q(sb.from("hq_v_outreach_week").select("*").order("week", { ascending: false }).limit(40)),
  ]);
  outreachForm($("#oForm"), rows);
  $("#oSave").onclick = () => saveOutreach($("#oForm"), d).then(() => renderOutreach(el, d));
  $("#oWeeks").innerHTML = weeks.length ? `<table><tr><th>Week of</th><th>Channel</th><th>Sent</th><th>Accept %</th><th>Reply %</th><th>Demos</th></tr>${weeks.map(w => `<tr><td>${fmtDay(w.week)}</td><td>${esc((CHANNELS.find(c => c[0] === w.channel) || [0, w.channel])[1])}</td><td>${w.sent}</td><td>${w.accept_pct ?? "-"}</td><td>${w.reply_pct ?? "-"}</td><td>${w.demos}</td></tr>`).join("")}</table>` : `<p class="muted small">Weekly totals show here once you log a day.</p>`;
}

/* ---------- NOTES ---------- */
const chatLog = [];
async function callAI(payload){
  const { data, error } = await sb.functions.invoke("hq-ai", { body: payload });
  if (error) throw error; if (data && data.error) throw new Error(data.error); return data;
}
async function renderNotes(el){
  el.innerHTML = `<div class="card"><h2>Brain dump</h2><textarea id="nBody" placeholder="Type or use the mic on your keyboard. Anything: lessons, ideas, frustrations, plans."></textarea>
    <div class="row" style="margin-top:8px"><button id="nSum">Save and summarise</button><button class="ghost" id="nSave">Just save</button></div><div id="nResult" class="small" style="margin-top:10px"></div></div>
  <div class="card"><h2>Ask your notes</h2><div class="chat" id="cLog"></div><div class="row"><input id="cQ" placeholder="e.g. What have I learned about sales this month?" style="flex:1;min-width:180px"><button id="cGo">Ask</button></div></div>
  <div class="card"><h2>What you've learned</h2><div id="nIns" class="muted small">Loading…</div></div>
  <div class="card"><h2>Past dumps</h2><ul class="list" id="nList"></ul></div>`;
  const drawChat = () => { $("#cLog").innerHTML = chatLog.map(m => `<div class="msg ${m.role === "user" ? "me" : "ai"}">${esc(m.content)}</div>`).join(""); $("#cLog").scrollTop = 1e9; };
  drawChat();
  const [ins, notes] = await Promise.all([
    q(sb.from("hq_insights").select("*").order("created_at", { ascending: false }).limit(300)),
    q(sb.from("hq_notes").select("*").order("created_at", { ascending: false }).limit(30)),
  ]);
  const kinds = [["lesson","Lessons"],["value","Values"],["idea","Ideas"],["goal","Goals"]];
  $("#nIns").innerHTML = ins.length ? kinds.map(([k, label]) => { const items = ins.filter(i => i.kind === k); return items.length ? `<h3 style="font-size:13px;margin:10px 0 4px;color:var(--text)">${label}</h3><ul class="list">${items.map(i => `<li><span class="grow" style="color:var(--text)">${esc(i.text)}</span><button class="x" data-di="${i.id}">✕</button></li>`).join("")}</ul>` : ""; }).join("") : "Lessons, values, ideas and goals from your dumps collect here.";
  $("#nList").innerHTML = notes.length ? notes.map(n => `<li><div class="grow"><div class="muted small">${new Date(n.created_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</div><div>${esc(n.summary || n.body.slice(0, 220) + (n.body.length > 220 ? "…" : ""))}</div></div><button class="x" data-dn="${n.id}">✕</button></li>`).join("") : `<li class="muted small">No dumps yet.</li>`;
  el.querySelectorAll("[data-di]").forEach(b => b.onclick = async () => { await q(sb.from("hq_insights").delete().eq("id", b.dataset.di)); renderNotes(el); });
  el.querySelectorAll("[data-dn]").forEach(b => b.onclick = async () => { if (!confirm("Delete this dump?")) return; await q(sb.from("hq_notes").delete().eq("id", b.dataset.dn)); renderNotes(el); });
  const save = async () => { const body = $("#nBody").value.trim(); if (!body) { toast("Write something first"); return null; } return q(sb.from("hq_notes").insert({ body }).select().single()); };
  $("#nSave").onclick = async () => { if (await save()) { toast("Saved"); renderNotes(el); } };
  $("#nSum").onclick = async () => {
    const b = $("#nSum"); b.disabled = true; b.textContent = "Summarising…";
    try {
      const note = await save(); if (!note) return;
      const r = await callAI({ mode: "summarise", note_id: note.id, text: note.body });
      toast("Summarised"); await renderNotes(el);
      $("#nResult").innerHTML = `<b>Summary:</b> ${esc(r.summary)}`;
    } catch (e) { toast("Saved, but the summary failed: " + e.message); renderNotes(el); }
    finally { b.disabled = false; b.textContent = "Save and summarise"; }
  };
  $("#cGo").onclick = async () => {
    const qn = $("#cQ").value.trim(); if (!qn) return;
    chatLog.push({ role: "user", content: qn }); $("#cQ").value = ""; drawChat();
    try { const r = await callAI({ mode: "chat", question: qn, history: chatLog.slice(0, -1) }); chatLog.push({ role: "assistant", content: r.answer }); }
    catch (e) { chatLog.push({ role: "assistant", content: "Couldn't answer: " + e.message }); }
    drawChat();
  };
  $("#cQ").addEventListener("keydown", e => { if (e.key === "Enter") $("#cGo").click(); });
}

boot();
</script>
</body>
</html>
