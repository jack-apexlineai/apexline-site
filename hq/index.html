/* ---------- SYSTEMS: every customer's live system (WasteLine licences today) ----------
   Read and changed through the hq-licences edge function, which holds the server key (never in this page).
   The function enforces the licence rules: no blank plans except an explicit lock, no past paid-until dates, every change logged. */
const SYS = { state: "idle", installs: [], log: [], err: "", showOwn: false, at: 0, busy: "" };
const SYS_PAID = ["core","fleet","full"];
const PLAN_LAB = { core: "Core", fleet: "Fleet", full: "Full Yard", free: "Free ordering", "": "No plan" };
async function sysCall(body){
  const { data, error } = await sb.functions.invoke("hq-licences", { body });
  if (error) {
    const e = new Error(error.message || "Request failed");
    try { e.status = error.context && error.context.status; const j = await error.context.json(); if (j && j.error) e.message = j.error; } catch (_) {}
    throw e;
  }
  return data;
}
async function loadSys(){
  SYS.state = SYS.installs.length ? "refresh" : "loading"; drawSys();
  try { const r = await sysCall({ mode: "list" }); SYS.installs = r.installs || []; SYS.log = r.log || []; SYS.state = "ok"; SYS.at = Date.now(); SYS.err = ""; }
  catch (e) { SYS.state = SYS.installs.length ? "stale" : (e.status === 404 ? "off" : "error"); SYS.err = e.message || "Request failed"; }
  drawSys();
}
function renderSystems(el){ drawSys(); if (SYS.state === "idle" || (!["loading","refresh"].includes(SYS.state) && Date.now() - SYS.at > 60000)) loadSys(); }
function sysAgo(t){
  if (!t) return "never";
  const m = Math.round((Date.now() - new Date(t)) / 6e4);
  if (m < 2) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour" : " hours") + " ago";
  const d = Math.round(h / 24); return d + (d === 1 ? " day" : " days") + " ago";
}
function sysStatus(x){
  if (x.status === "trial") return { t: "Trial, " + x.trial_days_left + (x.trial_days_left === 1 ? " day" : " days") + " left", c: "var(--hud)" };
  if (x.status === "active") return x.plan === "free" ? { t: "Free ordering", c: "var(--muted)" } : { t: "Active", c: "var(--good)" };
  return { t: "Locked out", c: "var(--bad)" };
}
function sysCard(x){
  const s = sysStatus(x), sd = x.days_since_seen, paid = SYS_PAID.includes(x.plan_set);
  const dot = sd === null ? "var(--muted)" : sd < 3 ? "var(--good)" : sd < 7 ? "var(--warn)" : "var(--bad)";
  const day = t => t ? fmtDay(String(t).slice(0, 10)) : "";
  const dates = x.status === "trial" ? ["Trial ends", day(x.trial_ends)] : ["Paid until", x.paid_until ? day(x.paid_until) : paid ? "No end date" : "Not charged"];
  return `<div class="syc ${SYS.busy === x.key ? "saving" : ""}" data-sys="${esc(x.key)}">
    <div class="syh"><div><b>${esc(x.yard_name)}</b><div class="muted small">${esc(PLAN_LAB[x.plan_set] !== undefined ? PLAN_LAB[x.plan_set] : x.plan_set)}${x.hide_yard ? ", yard pages hidden" : ""}</div></div><span class="chip" style="color:${s.c};border-color:${s.c}">${esc(s.t)}</span></div>
    <div class="sygrid">
      <div><span class="lab">Last opened</span><span><i class="sdot" style="background:${dot}"></i>${esc(sysAgo(x.last_seen))}</span></div>
      <div><span class="lab">${dates[0]}</span><span>${esc(dates[1])}</span></div>
      <div><span class="lab">Emails this month</span><span>${x.email_service ? `${x.mail_month_count} of ${x.mail_month_cap}` : "Own Gmail"}</span></div>
      <div><span class="lab">Signed up</span><span>${esc(day(x.created_at))}</span></div>
    </div>
    ${x.flags && x.flags.length ? `<ul class="syflags">${x.flags.map(f => `<li class="${f.level === "bad" ? "bad" : "warn"}">${esc(f.text)}</li>`).join("")}</ul>` : ""}
    ${x.notes ? `<div class="muted small sy-note">${esc(x.notes)}</div>` : ""}
    <div class="syact">
      ${paid ? `<button class="ghost sm" data-sya="paid_month">Paid a month</button><button class="ghost sm" data-sya="paid_year">Paid a year</button>` : ""}
      <button class="ghost sm" data-sya="extend_trial">Extend trial 14 days</button>
      <select data-syplan aria-label="Change plan"><option value="">Change plan</option>${SYS_PAID.map(p => `<option value="${p}" ${p === x.plan_set ? "disabled" : ""}>${PLAN_LAB[p]}</option>`).join("")}</select>
      ${x.plan_set !== "free" ? `<button class="ghost sm" data-sya="to_free">Drop to free ordering</button>` : ""}
      <button class="ghost sm" data-sya="email">Email service ${x.email_service ? "on" : "off"}</button>
      <button class="ghost sm" data-sya="note">Note</button>
      ${x.status !== "expired" ? `<button class="ghost sm danger" data-sya="lock">Lock out</button>` : ""}
    </div></div>`;
}
async function sysChange(x, action, value, extra = {}){
  if (SYS.busy) return toast("Still saving the last change");
  SYS.busy = x.key; drawSys();
  try {
    const r = await sysCall({ mode: "change", key: x.key, action, value, ...extra });
    const i = SYS.installs.findIndex(y => y.key === x.key); if (i >= 0) SYS.installs[i] = r.install;
    if (r.log) SYS.log.unshift(r.log);
    toast(x.yard_name + ": " + (r.log ? r.log.detail : "saved") + (r.warning ? ". " + r.warning : ""));
  } catch (e) { toast("Not changed: " + e.message); }
  SYS.busy = ""; drawSys();
}
function sysAct(x, a, v){
  const n = x.yard_name;
  if (a === "paid_month" && confirm(`Mark ${n} as paid for a month? Their paid-until date moves a month on.`)) return sysChange(x, "paid_month");
  if (a === "paid_year" && confirm(`Mark ${n} as paid for a year? Their paid-until date moves a year on.`)) return sysChange(x, "paid_year");
  if (a === "extend_trial" && confirm(`Extend ${n}'s trial by 14 days? Their plan stays as it is.`)) return sysChange(x, "extend_trial", 14);
  if (a === "set_plan" && confirm(`Change ${n} to ${PLAN_LAB[v]}?${x.paid_until ? "" : " With no paid-until date it won't lapse until you set one."}`)) return sysChange(x, "set_plan", v);
  if (a === "to_free" && confirm(`Drop ${n} to free ordering? They keep orders and card payments and lose the paid pages. Takes effect next time the app opens, within about 10 minutes.`)) return sysChange(x, "to_free");
  if (a === "email" && confirm(`Turn the ApexLine email service ${x.email_service ? "off" : "on"} for ${n}?${x.email_service ? " Their emails go back through their own Gmail, 100 a day." : ""}`)) return sysChange(x, "set_flag", { field: "email_service", on: !x.email_service });
  if (a === "lock" && confirm(`Lock ${n} out completely? Everything turns off, ordering included, next time the app opens. If they were promised free ordering, use Drop to free ordering instead.`)) return sysChange(x, "lock", null, { confirm: "LOCK" });
  if (a === "note") { const t = prompt("Note for " + n, x.notes || ""); if (t !== null) return sysChange(x, "set_note", t); }
}
function drawSys(){
  if (curTab() !== "systems") return;
  const el = $("#page");
  const cust = SYS.installs.filter(x => !x.own), own = SYS.installs.filter(x => x.own);
  const paying = cust.filter(x => x.status === "active" && SYS_PAID.includes(x.plan)), trial = cust.filter(x => x.status === "trial");
  const locked = cust.filter(x => x.status === "expired"), look = cust.filter(x => x.flags && x.flags.length);
  const names = a => esc(a.map(x => x.yard_name).join(", "));
  const stTxt = {
    loading: `<div class="pstate"><span class="dot"></span>Loading from the licence server</div>`,
    refresh: `<div class="pstate"><span class="dot"></span>Refreshing</div>`,
    ok: `<div class="pstate"><span class="dot"></span>Live from the licence server, updated ${new Date(SYS.at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}. Yards check in every 10 minutes while the app is open.</div>`,
    stale: `<div class="pstate warn"><span class="dot"></span>Couldn't refresh (${esc(SYS.err)}). Showing the last load.</div>`,
    off: `<div class="pstate warn" id="syOff"><span class="dot"></span>The hq-licences link isn't switched on yet.</div>`,
    error: `<div class="pstate warn" id="syOff"><span class="dot"></span>Couldn't reach the licence server (${esc(SYS.err)}).</div>`,
    idle: "",
  }[SYS.state] || "";
  el.innerHTML = phead("Every customer system, live", "Systems", `<div class="ptools"><button class="ghost" id="syRefresh">Refresh</button></div>`) + stTxt +
  `<div class="kpis" id="syStats">
    ${kpi(paying.length, "Paying", paying.length ? names(paying) : "nobody on a paid plan yet", { k: "sypay" })}
    ${kpi(trial.length, "On trial", trial.length ? names(trial) : "none right now", { k: "sytrial" })}
    ${kpi(locked.length, "Locked out", locked.length ? names(locked) : "nobody", { warn: !!locked.length, k: "sylock" })}
    ${kpi(look.length, "Need a look", look.length ? names(look) : "all fine", { warn: !!look.length, k: "sylook" })}
  </div>
  <div class="card"><div class="card-h"><h2>WasteLine yards</h2><span class="cnt">${cust.length} ${cust.length === 1 ? "yard" : "yards"}</span></div>
    <div class="sylist" id="syList">${cust.map(sysCard).join("") || `<div class="empty small">${SYS.state === "ok" ? "No customer yards yet." : "Nothing loaded yet."}</div>`}</div>
    ${own.length ? `<button class="ghost sm" id="syOwn" style="margin-top:12px">${SYS.showOwn ? "Hide" : "Show"} your demo and test installs (${own.length})</button>${SYS.showOwn ? `<div class="sylist" id="syOwnList" style="margin-top:12px">${own.map(sysCard).join("")}</div>` : ""}` : ""}
  </div>
  <div class="dash" style="margin-top:16px">
    <div class="col"><div class="card"><div class="card-h"><h2>Custom builds</h2></div><div class="muted small">Each custom build runs on its own database and its own domain. They show here with uptime and last use once they go live, Noble Commercial first.</div></div></div>
    <div class="col"><div class="card"><div class="card-h"><h2>Change log</h2><span class="cnt">last ${SYS.log.length}</span></div><ul class="lines" id="syLog">${SYS.log.map(l => `<li><span class="muted small" style="flex:none">${esc(ukTime(l.at, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</span><span><b>${esc(l.yard_name || "")}</b> ${esc(l.detail)}</span></li>`).join("") || '<li class="muted small">No changes yet.</li>'}</ul></div></div>
  </div>`;
  $("#navSys").textContent = look.length || "";
  $("#syRefresh").onclick = () => loadSys();
  const so = $("#syOwn"); if (so) so.onclick = () => { SYS.showOwn = !SYS.showOwn; drawSys(); };
  el.querySelectorAll("[data-sya]").forEach(b => b.onclick = () => { const x = SYS.installs.find(y => y.key === b.closest("[data-sys]").dataset.sys); if (x) sysAct(x, b.dataset.sya); });
  el.querySelectorAll("[data-syplan]").forEach(sel => sel.onchange = () => { const x = SYS.installs.find(y => y.key === sel.closest("[data-sys]").dataset.sys); const v = sel.value; sel.value = ""; if (x && v) sysAct(x, "set_plan", v); });
}

/* ---------- OUTREACH: LinkedIn funnel (same maths as LinkedIn/linkedin_stats.py) + daily log ---------- */
const pyRound = x => { const f = Math.floor(x), r = x - f; return r > 0.5 ? f + 1 : r < 0.5 ? f : (f % 2 === 0 ? f : f + 1); };
const pct = (a, b) => b ? `${a}/${b} (${pyRound(100 * a / b)}%)` : `${a}/0`;
function liStats(rows, d = today()){
  const age = x => x ? daysBetween(x, d) : -1;
  const sumUp = rs => { const old = rs.filter(r => age(r.sent_on) >= 3), acc = old.filter(r => r.status === "accepted"), dmd = rs.filter(r => r.dm1_date), dmo = dmd.filter(r => age(r.dm1_date) >= 3), rep = dmo.filter(r => r.dm1_reply_date || r.fu1_reply_date);
    return { sent: rs.length, old: old.length, acc: acc.length, dmd: dmd.length, dmo: dmo.length, rep: rep.length, out: rs.filter(r => r.outcome).length }; };
  const grp = key => { const g = new Map(); rows.forEach(r => { const k = key(r); if (!g.has(k)) g.set(k, []); g.get(k).push(r); }); return [...g].sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).map(([k, rs]) => ({ k, ...sumUp(rs) })); };
  return {
    all: sumUp(rows),
    byBatch: grp(r => `${r.batch} / ${r.request_variant}`), byType: grp(r => r.type || ""), byStyle: grp(r => r.dm1_style || "(no DM yet)"),
    due: rows.filter(r => r.dm1_date && !r.dm1_reply_date && !r.fu1_date && age(r.dm1_date) >= 4),
    needDm: rows.filter(r => r.status === "accepted" && !r.dm1_date),
    accepted: rows.filter(r => r.status === "accepted").length,
    replied: rows.filter(r => r.dm1_reply_date || r.fu1_reply_date).length,
    fuSent: rows.filter(r => r.fu1_date).length,
  };
}
function liTable(title, groups){
  return `<div class="eyebrow" style="margin:14px 0 4px">${title}</div><div class="tablewrap"><table><tr><th>Group</th><th>Sent</th><th>Accepted 3d+</th><th>DMed</th><th>Replied 3d+</th><th>Outcome</th></tr>${groups.map(g => `<tr><td>${esc(g.k)}</td><td>${g.sent}</td><td>${pct(g.acc, g.old)}</td><td>${g.dmd}</td><td>${pct(g.rep, g.dmo)}</td><td>${g.out}</td></tr>`).join("")}</table></div>`;
}
function parseCSV(text){
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] || "").trim()])));
}
function liRowsFromCsv(recs){
  const n = v => v ? v : null;
  return recs.map(r => ({ sent_on: n(r.date), name: r.name, role: n(r.role), company: n(r.company), area: n(r.area), type: n(r.type), profile_url: r.profile_url || "name:" + r.name, status: n(r.status), batch: n(r.batch), request_variant: n(r.request_variant), accepted_date: n(r.accepted_date), dm1_date: n(r.dm1_date), dm1_style: n(r.dm1_style), dm1_reply_date: n(r.dm1_reply_date), reply_summary: n(r.reply_summary), fu1_date: n(r.fu1_date), fu1_reply_date: n(r.fu1_reply_date), outcome: n(r.outcome) })).filter(r => r.name);
}

  const kinds = [["lesson","Lessons"],["value","Values"],["idea","Ideas"],["goal","Goals"]];
  $("#nIns").innerHTML = ins.length ? kinds.map(([k, label]) => { const items = ins.filter(i => i.kind === k); return items.length ? `<h3 style="font-size:13px;margin:10px 0 4px;color:var(--text)">${label}</h3><ul class="lines">${items.map(i => `<li><span class="grow" style="color:var(--text)">${esc(i.text)}</span><button class="x" data-di="${i.id}">✕</button></li>`).join("")}</ul>` : ""; }).join("") : "Lessons, values, ideas and goals from your dumps collect here.";
  $("#nList").innerHTML = notes.length ? notes.map(n => `<li><div class="grow"><div class="muted small">${new Date(n.created_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</div><div>${esc(n.summary || n.body.slice(0, 220) + (n.body.length > 220 ? "…" : ""))}</div></div><button class="x" data-dn="${n.id}">✕</button></li>`).join("") : `<li class="muted small">No dumps yet.</li>`;
  el.querySelectorAll("[data-di]").forEach(b => b.onclick = async () => { await q(sb.from("hq_insights").delete().eq("id", b.dataset.di)); renderNotes(el); });
  el.querySelectorAll("[data-dn]").forEach(b => b.onclick = async () => { if (!confirm("Delete this dump?")) return; await q(sb.from("hq_notes").delete().eq("id", b.dataset.dn)); renderNotes(el); });
  const save = async () => { const body = $("#nBody").value.trim(); if (!body) { toast("Write something first"); return null; } return q(sb.from("hq_notes").insert({ body }).select().single()); };
  $("#nSave").onclick = async () => { if (await save()) { toast("Saved"); renderNotes(el); } };
  $("#nSum").onclick = async () => {
    const b = $("#nSum"); b.disabled = true; b.textContent = "Summarising…";
    try {
      const note = await save(); if (!note) return;
      const r = await callAI({ mode: "summarise", note_id: note.id, text: note.body });
      toast("Summarised"); await renderNotes(el);
      $("#nResult").innerHTML = `<b>Summary:</b> ${esc(r.summary)}`;
    } catch (e) { toast("Saved, but the summary failed: " + e.message); renderNotes(el); }
    finally { b.disabled = false; b.textContent = "Save and summarise"; }
  };
  $("#cGo").onclick = async () => {
    const qn = $("#cQ").value.trim(); if (!qn) return;
    chatLog.push({ role: "user", content: qn }); $("#cQ").value = ""; drawChat();
    try { const r = await callAI({ mode: "chat", question: qn, history: chatLog.slice(0, -1) }); chatLog.push({ role: "assistant", content: r.answer }); }
    catch (e) { chatLog.push({ role: "assistant", content: "Couldn't answer: " + e.message }); }
    drawChat();
  };
  $("#cQ").addEventListener("keydown", e => { if (e.key === "Enter") $("#cGo").click(); });
}

window.HQ = { money, todayTasks, todayCounts, liStats, followUps, parseCSV, S, payItems, payMonth, payWeek, validCost, validExpected, PV };
init();
</script>
