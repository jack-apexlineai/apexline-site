<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1A;--side:#0C1320;--card:#111A2A;--card2:#16213A;--line:#1F2B40;--text:#E7ECF4;--muted:#8B97AD;--accent:#5CC8F5;--hud:#5CE1FF;--good:#34D399;--warn:#FBBF24;--bad:#F87171;--violet:#A78BFA;--r:16px;--sideW:236px;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--head:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html{background:var(--bg)}
body{background:radial-gradient(1100px 520px at 75% -8%,rgba(40,90,150,.28) 0%,transparent 60%),var(--bg);min-height:100vh}
a{color:var(--accent)}
button,a,.tc,label{-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0B1322;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=number]{width:96px}
button{background:var(--accent);color:#06121F;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
button.x{background:transparent;color:var(--muted);padding:4px 8px;border:0;font-weight:500}
button.sm{padding:6px 12px;font-size:13px}
button:disabled{opacity:.5}

/* shell: side menu like the WasteLine demo */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sideW);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px calc(14px + env(safe-area-inset-bottom));z-index:40;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{width:34px;height:34px;color:var(--hud);flex:none}
.brand b{font-family:var(--head);font-size:17px;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:1px}
.side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#C3CCDA;text-decoration:none;font-weight:500;margin-bottom:2px}
.side a.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side a.nav:hover{background:rgba(255,255,255,.04)}
.side a.nav.on{background:rgba(92,200,245,.1);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.side a.nav .badge:empty{display:none}
.side a.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--card2);border-radius:99px;padding:1px 8px;color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 4px 0}
.content{margin-left:var(--sideW);padding:28px 32px 56px;max-width:1380px}
.topbar{display:none}
.scrim{display:none}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.phead h1{font-family:var(--head);font-size:34px;line-height:1.1;margin:6px 0 0;letter-spacing:-.6px;font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi b{display:block;font-family:var(--head);font-size:28px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .lab{color:#C3CCDA;font-size:14px}
.kpi .sub{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:13px;color:var(--muted)}
.kpi.hi b{color:var(--hud);text-shadow:0 0 18px rgba(92,225,255,.35)}
.kpi .sub.warn{color:var(--warn)}

.dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-family:var(--head);font-size:17px;margin:0;font-weight:700}
.card-h a,.card-h .lnk{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;background:none;padding:0;border:0;cursor:pointer}
.card-h .cnt{color:var(--muted);font-size:13px;font-family:var(--mono)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.lines li:last-child{border-bottom:0}
.lines .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.lines .grow.pname{overflow-wrap:normal}
.lines .k{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:rgba(52,211,153,.35)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}
.chip.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}
.chip.hud{color:var(--hud);border-color:rgba(92,225,255,.35)}
.chip.violet{color:var(--violet);border-color:rgba(167,139,250,.35)}
.bar{height:8px;background:#0B1322;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#132036;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:120;max-width:90vw}
.toast.show{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:7px 12px;font-size:13px;font-weight:600}
.chips button.on{color:#fff;border-color:var(--accent);background:rgba(92,200,245,.12)}

/* task cards */
.tc{--st:var(--muted);display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--st);border-radius:12px;background:var(--card2);margin-bottom:8px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.tc:hover,.tc.open{border-color:rgba(92,200,245,.45);border-left-color:var(--st);background:#19263F}
.tc.s-running{--st:var(--hud)}.tc.s-waiting{--st:var(--warn)}.tc.s-scheduled{--st:var(--violet)}.tc.s-done{--st:var(--good)}
.tc .ck{width:24px;height:24px;border-radius:50%;border:2px solid #4A5870;background:transparent;flex:none;padding:0;display:grid;place-items:center;color:#06121F;font-size:14px;font-weight:800;margin-top:1px}
.tc .ck:hover{border-color:var(--good)}
.tc.s-done .ck{background:var(--good);border-color:var(--good)}
.tc .body{flex:1;min-width:0}
.tc .tt{font-weight:600;overflow-wrap:anywhere}
.tc.s-done .tt{color:var(--muted);text-decoration:line-through}
.tc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tc .peek{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.run .stdot{box-shadow:0 0 8px var(--hud);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}
/* day plan */
.dp .card-h{flex-wrap:wrap}
.dp-date{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:.5px}
.dp-tog button{padding:6px 12px}
.dp-status{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.dp-pill{display:inline-flex;align-items:center;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);white-space:nowrap}
.dp-pill.good{color:var(--good);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.dp-pill.bad{color:var(--bad);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
.dp-pill.hud{color:var(--hud);border-color:rgba(92,225,255,.4);background:rgba(92,225,255,.07)}
.dp-status b{color:var(--text)}
.dp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.dp-stats > div{background:#0B1322;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.dp-stats b{display:block;font-family:var(--head);font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-stats > div > span{color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.dp-stats .stdot{box-shadow:0 0 8px var(--hud);animation:pulse 1.4s infinite}
.dpr{--st:#2A3850;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--st);border-radius:12px;background:var(--card2);margin-bottom:8px;min-width:0}
.dpr:last-child{margin-bottom:0}
.dpr.run{--st:var(--hud);border-color:rgba(92,225,255,.4);border-left-color:var(--st);box-shadow:0 0 18px rgba(92,225,255,.08)}
.dpr.over{--st:var(--bad);border-color:rgba(248,113,113,.45);border-left-color:var(--st)}
.dpr.done{--st:var(--good);background:transparent}
.dp-time{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--hud);line-height:1.3}
.dpr.done .dp-time{color:var(--muted)}
.dp-main{min-width:0}
.dp-title{background:none;border:0;padding:0;color:var(--text);font-weight:600;font-size:15px;line-height:1.3;text-align:left;cursor:pointer;overflow-wrap:anywhere;max-width:100%}
.dp-title:hover{color:var(--accent)}
.dpr.done .dp-title{color:var(--muted);text-decoration:line-through}
.dp-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dp-live{display:flex;align-items:center;gap:10px;margin-top:10px;min-width:0}
.dp-clock{font-family:var(--mono);font-weight:600;font-size:14px;min-width:54px}
.dp-bar{flex:1;min-width:40px}
.dp-live.paused .dp-bar i{background:#4A5870}
.dp-live.run .dp-bar i{background:var(--hud);box-shadow:0 0 8px rgba(92,225,255,.5)}
.dp-live.run .dp-clock{color:var(--hud)}
.dp-live.near .dp-bar i{background:var(--warn)}
.dp-live.near .dp-clock{color:var(--warn)}
.dp-live.over .dp-bar i{background:var(--bad)}
.dp-live.over .dp-clock{color:var(--bad)}
.dp-steps{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--line)}
.dp-steps label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:14px;line-height:1.35}
.dp-steps input{width:18px;height:18px;margin:0;padding:0;flex:none;accent-color:var(--good);cursor:pointer}
.dp-steps li.on span{color:var(--muted);text-decoration:line-through}
.dp-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.dp-btns button{white-space:nowrap}
.dp-btns .btn{gap:.3em}
button.dp-pause{background:var(--warn)}
button.chip.dp-stog{background:transparent;color:var(--accent);border-color:rgba(92,200,245,.3)}
button.chip.dp-stog:hover{border-color:var(--accent)}
.dp-narrow{display:none}

/* task detail card: hover pop on laptop, sheet on phone */
#tdBack{position:fixed;inset:0;background:rgba(3,6,12,.55);z-index:58}
#td{position:fixed;z-index:60;width:390px;max-width:calc(100vw - 24px);max-height:min(76vh,640px);overflow:auto;background:#0F1828;border:1px solid rgba(92,200,245,.4);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:18px;overscroll-behavior:contain}
#td.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;max-height:86vh;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#td .grab{display:none;width:44px;height:5px;border-radius:9px;background:#33415a;margin:-6px auto 12px}
#td.sheet .grab{display:block}
#td .td-h{display:flex;gap:8px;align-items:flex-start}
#td .td-title{flex:1;font-family:var(--head);font-size:18px;font-weight:700;background:transparent;border:1px solid transparent;padding:4px 6px;margin:-4px 0 0 -6px}
#td .td-title:hover{border-color:var(--line)}
#td .td-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
#td .td-meta select,#td .td-meta input{width:100%;padding:8px 10px;font-size:14px}
#td h4{margin:16px 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:var(--mono);display:flex;justify-content:space-between;align-items:center}
#td .desc{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#D5DDEA}
#td .desc ul{margin:4px 0;padding-left:18px;white-space:normal}
#td .desc li{margin:3px 0}
#td .note{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;white-space:pre-wrap;position:relative}
#td .note time{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#td .note .x{position:absolute;top:4px;right:2px}
#td .td-f{display:flex;gap:8px;margin-top:16px}

/* CRM board and deal cards */
.board{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
@media (hover: hover) and (pointer: fine){.board{scroll-snap-type:none}}
.bcol{flex:0 0 250px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:14px;padding:12px;scroll-snap-align:start;min-width:0}
.bcol h3{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;margin:2px 2px 10px;font-family:var(--head)}
.dc{--st:var(--muted);display:block;padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--st);border-radius:12px;background:var(--card2);margin-bottom:8px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.dc:hover,.dc.open{border-color:rgba(92,200,245,.45);border-left-color:var(--st);background:#19263F}
.dc b{display:block;font-size:14px;overflow-wrap:anywhere}
.dc .who{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.sylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.syc{border:1px solid var(--line);border-radius:14px;background:var(--card2);padding:14px;min-width:0;transition:opacity .15s}
.syc.saving{opacity:.5;pointer-events:none}
.syh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.syh b{font-size:15px}
.sygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0}
.sygrid>div{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.sygrid .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-family:var(--mono)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.syflags{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:5px}
.syflags li{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.syflags li.warn{color:var(--warn)}.syflags li.bad{color:var(--bad)}
.sy-note{margin:0 0 10px}
.syact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.syact select{padding:6px 10px;font-size:13px;width:auto;max-width:100%}
button.danger{color:var(--bad)}
.addp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.addp.big{margin:12px 0 4px;padding:10px;border:1px dashed var(--line);border-radius:12px}.addp .muted{margin-right:2px}
.dcrow{cursor:pointer}
.dcrow:hover b{color:var(--accent)}
.sbar{display:grid;grid-template-columns:104px 1fr 34px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.sbar .fb{height:10px;background:#0B1322;border-radius:99px;overflow:hidden}
.sbar .fb i{display:block;height:100%;border-radius:99px}
.funnel .sbar{grid-template-columns:96px 1fr 46px}
.tl{list-style:none;margin:6px 0 0 6px;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 16px;font-size:14px}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:#0F1828;border:2px solid var(--accent)}
.tl li.in::before{border-color:var(--good)}
.tl li.note::before{border-color:var(--warn)}
.tl .when{color:var(--muted);font-size:12px}
.tl .words{display:block;font-style:italic;color:#C3CCDA;margin-top:4px}
.tl .out{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
a.btn,button.btn,label.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;background:rgba(255,255,255,.03)}
a.btn:hover,button.btn:hover,label.btn:hover{border-color:var(--accent)}
.path{font-family:var(--mono);font-size:12px;color:#C3CCDA;background:#0B1322;border:1px solid var(--line);border-radius:8px;padding:3px 8px;overflow-wrap:anywhere;cursor:copy}
#td label.f{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-family:var(--mono)}
.callc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card2);margin-bottom:10px}
.callc h3{font-family:var(--head);font-size:16px;margin:4px 0 6px}
.callc .sum{white-space:pre-wrap;font-size:14px;color:#D5DDEA;line-height:1.5}
.callc details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;margin-top:6px}
button.chip{cursor:pointer}

.postprev{white-space:pre-wrap;font-size:14px;line-height:1.5;color:#C3CCDA;background:#0B1322;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:4px;max-height:9.5em;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}

/* rings and charts */
.ringcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ringcard svg{width:132px;height:132px;flex:none}
.ringcard .rl{flex:1;min-width:150px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.bars div{flex:1;background:linear-gradient(180deg,var(--accent),rgba(92,200,245,.25));border-radius:5px 5px 2px 2px;min-height:2px;position:relative}
.bars div.today{background:linear-gradient(180deg,var(--hud),rgba(92,225,255,.4));box-shadow:0 0 12px rgba(92,225,255,.4)}
.barlab{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px;font-family:var(--mono)}
.chart svg{width:100%;height:150px;display:block}

/* deals */
.deal{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.deal b{display:block}
.deal select{padding:4px 8px;font-size:12px;margin-top:8px}

/* plan */
.plan label{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.plan label:last-child{border-bottom:0}
.plan label input{width:20px;height:20px;accent-color:var(--good);padding:0;flex:none}
.plan label .grow{flex:1;min-width:0}
.plan label.done .grow{color:var(--muted);text-decoration:line-through}
.plan h3{font-size:14px;margin:14px 0 4px}

/* misc v2 */
.chat{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:#06121F}
.msg.ai{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.cal div.on{background:var(--accent);color:#06121F;font-weight:700}
.cal div.today{outline:1px solid var(--warn)}

/* login + lock */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#lock .card{align-items:center;text-align:center;background:transparent;border:0}
#lock .logo{width:72px;height:72px;color:var(--hud)}
#pinTitle{font-family:var(--head);font-size:20px;margin:8px 0 0}
.dots{display:flex;gap:14px;margin:14px 0 6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hud);display:block}
.dots i.on{background:var(--hud);box-shadow:0 0 10px var(--hud)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:10px}
.pad button{height:72px;border-radius:50%;background:rgba(92,225,255,.06);border:1px solid rgba(92,225,255,.25);color:var(--text);font-size:24px;font-weight:500;font-family:var(--mono)}
.pad button:active{background:rgba(92,225,255,.2)}
.pad button.blank{visibility:hidden}
.pad button.fn{font-size:13px;background:transparent;border-color:transparent;color:var(--muted)}

/* boot */
#boot{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#0b1a30 0%,#05080F 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,26px);padding:24px 16px calc(24px + env(safe-area-inset-bottom));cursor:pointer;overflow:hidden;transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
#boot::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(92,225,255,.035) 0 1px,transparent 1px 4px);pointer-events:none}
#boot .mono{width:clamp(96px,22vw,150px);height:auto;overflow:visible}
#boot .car{width:min(560px,92vw);height:auto;overflow:visible}
.mono .ring{fill:none;stroke:var(--hud);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(92,225,255,.7))}
.mono .ring2{fill:none;stroke:rgba(92,225,255,.35);stroke-width:1;opacity:0}
.mono .sig{fill:#F4FBFF;fill-opacity:0;stroke:#F4FBFF;stroke-width:1.1;stroke-dasharray:420;stroke-dashoffset:420;filter:drop-shadow(0 0 5px rgba(160,230,255,.45))}
.mono .sweep{opacity:0}
.car .shell{fill:url(#bodyFill);stroke:rgba(234,246,255,.10);stroke-width:1;vector-effect:non-scaling-stroke}
.car .wingshell{stroke:rgba(234,246,255,.14)}
.car .tyre{fill:#020409;stroke:rgba(234,246,255,.05);stroke-width:1;vector-effect:non-scaling-stroke}
.car .arch{fill:none;stroke:rgba(234,246,255,.14);stroke-width:1;vector-effect:non-scaling-stroke}
.car .hubring{fill:none;stroke:rgba(234,246,255,.05);stroke-width:1;vector-effect:non-scaling-stroke}
.car .neck{fill:none;stroke:rgba(234,246,255,.22);stroke-width:1.2;vector-effect:non-scaling-stroke}
.car .rim{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.car .rimRoof{stroke:url(#gRoof);stroke-width:2.4;filter:url(#rimGlow)}
.car .rimNose{stroke:url(#gNose);stroke-width:2;filter:url(#rimGlow)}
.car .rimWing{stroke:url(#gWing);stroke-width:1.6;filter:url(#rimGlow)}
.car .rimLamp{stroke:rgba(255,255,255,.55);stroke-width:1.4}
.car .rimMirror{stroke:rgba(255,255,255,.45);stroke-width:1.3}
.car .rimDlo{stroke:rgba(234,246,255,.16);stroke-width:1}
.car .rimDoor{stroke:rgba(234,246,255,.10);stroke-width:1}
.car .rimHaunch{stroke:rgba(255,255,255,.35);stroke-width:6}
.car .rimTrace{stroke:#FFFFFF;stroke-width:1.15;filter:url(#rimGlow)}
.car .rimMain{stroke:#FFFFFF;stroke-width:1.6}
#boot.go .car .rimTrace{animation:draw .8s var(--d,1.6s) ease-out forwards}
#boot.go .car .rimMain{animation:draw 1.6s 1.3s cubic-bezier(.45,.05,.3,1) forwards}
.car .glint{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:.05 2;stroke-dashoffset:.05;opacity:0;filter:url(#rimGlow)}
.car .shell,.car .tyre,.car .arch,.car .hubring,.car .neck,.car .floor{opacity:0}
#boot.go .mono .ring{animation:draw .6s ease-out forwards}
#boot.go .mono .ring2{animation:fade .5s .35s forwards}
#boot.go .mono .sig{animation:draw .8s .2s ease-in-out forwards,sigfill .45s .8s ease-out forwards}
@keyframes sigfill{to{fill-opacity:1}}
#boot.go .mono .sweep{animation:sweep .7s .95s ease-in-out forwards}
#boot.go .car .shell,#boot.go .car .tyre,#boot.go .car .arch,#boot.go .car .hubring,#boot.go .car .neck{animation:fade .8s 1.2s ease-out forwards}
#boot.go .car .floor{animation:fade 1s 1.6s forwards}
#boot.go .car .rimRoof{animation:draw 1.3s 1.35s cubic-bezier(.45,.05,.3,1) forwards}
#boot.go .car .rimNose{animation:draw .9s 1.6s ease-out forwards}
#boot.go .car .rimDlo,#boot.go .car .rimDoor{animation:draw .7s 2s ease-out forwards}
#boot.go .car .rimLamp,#boot.go .car .rimMirror{animation:draw .45s 2.15s ease-out forwards}
#boot.go .car .rimWing{animation:draw .55s 2.25s ease-out forwards}
#boot.go .car .rimHaunch{animation:draw .8s 2.3s ease-out forwards}
#boot.go .car .glint{animation:glint 1.4s 1.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes glint{0%{opacity:0;stroke-dashoffset:.05}15%{opacity:1}85%{opacity:1}100%{opacity:0;stroke-dashoffset:-1}}
#boot.go .hudrow > div{animation:rise .5s ease-out forwards}
#boot.go .hudrow > div:nth-child(1){animation-delay:1.25s}
#boot.go .hudrow > div:nth-child(2){animation-delay:1.35s}
#boot.go .hudrow > div:nth-child(3){animation-delay:1.45s}
#boot.go .hudrow > div:nth-child(4){animation-delay:1.55s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes sweep{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(300px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hudrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(720px,100%)}
.hudrow > div{opacity:0;border:1px solid rgba(92,225,255,.25);background:rgba(92,225,255,.04);border-radius:10px;padding:10px 12px;min-width:0}
.hudrow b{display:block;font-family:var(--mono);font-size:clamp(18px,4.6vw,26px);color:var(--hud);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 12px rgba(92,225,255,.45)}
.hudrow span{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:var(--mono)}
.hudrow small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
#boot .skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);margin:0}
#boot .hello{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin:0;opacity:0;text-align:center}
#boot.go .hello{animation:fade .5s .6s forwards}
#boot.still *{animation:none!important}
#boot.still .mono .ring,#boot.still .mono .sig,#boot.still .car .rim,.mono .sig{stroke-dashoffset:0}.mono .sig{fill-opacity:1}
#boot.still .mono .sig{fill-opacity:1}
#boot.still .mono .ring2,#boot.still .car .shell,#boot.still .car .tyre,#boot.still .car .arch,#boot.still .car .hubring,#boot.still .car .neck,#boot.still .car .floor,#boot.still .hello,#boot.still .hudrow > div{opacity:1}
#boot.still .car .glint{opacity:0}
@media (prefers-reduced-motion: reduce){#boot *{animation:none!important;transition:none!important}.car .rim{stroke-dashoffset:0}.chip.run .stdot,.dp-stats .stdot{animation:none}}

/* calendar and clients pages (24 Nov) */
.pc.cal-meet,.arow.cal-meet{background:rgba(167,139,250,.22);color:#DDD6FE;border-color:rgba(167,139,250,.55)}.arow.cal-meet{--c:#A78BFA}
.pc.cal-task{background:rgba(92,200,245,.1);color:#BAE6FD;border-color:rgba(92,200,245,.3)}.arow.cal-task{--c:var(--accent)}
.pc.cal-late,.arow.cal-late{background:rgba(248,113,113,.13);color:#FCA5A5;border-color:rgba(248,113,113,.4)}.arow.cal-late{--c:var(--bad)}
.pc.cal-fu{background:rgba(251,191,36,.1);color:#FDE68A;border-color:rgba(251,191,36,.4)}.arow.cal-fu{--c:var(--warn)}
.pc.cal-live,.arow.cal-live{background:rgba(52,211,153,.18);color:#A7F3D0;border-color:rgba(52,211,153,.5)}.arow.cal-live{--c:var(--good)}
.pc.cal-money{background:transparent;color:var(--good);border-color:var(--good)}.arow.cal-money{--c:var(--good)}
.pc.cal-post{opacity:.6;border-style:dashed;border-color:var(--line);color:var(--muted)}
.pc.cal-done{opacity:.45;text-decoration:line-through;color:var(--muted)}
.pc .ctm{font:600 11px var(--mono);opacity:.85}
.pkey i.kk{border:1px solid}
.pkey i.kk.cal-meet{background:rgba(167,139,250,.4);border-color:#A78BFA}.pkey i.kk.cal-task{background:rgba(92,200,245,.2);border-color:var(--accent)}.pkey i.kk.cal-fu{background:rgba(251,191,36,.2);border-color:var(--warn)}.pkey i.kk.cal-live{background:rgba(52,211,153,.35);border-color:var(--good)}.pkey i.kk.cal-money{border-color:var(--good)}.pkey i.kk.cal-late{background:rgba(248,113,113,.3);border-color:var(--bad)}
.cal-li,.tcal{cursor:pointer}
.clgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;margin-bottom:18px}
.clc{border-left:3px solid var(--st);margin:0}
.clh{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.clh .cln{font-size:16px}
.clnx{color:var(--text);opacity:.9;overflow-wrap:anywhere}
.clm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.clm>div{background:rgba(255,255,255,.03);border:1px solid var(--line,rgba(255,255,255,.08));border-radius:10px;padding:8px 10px;min-width:0}
.clm b{display:block;font-size:17px;line-height:1.2}
.clm span{font-size:11px;opacity:.7}
.clbar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 0 4px}
.clbar i{display:block;height:100%;background:#34D399}
.cltrack{display:flex;gap:3px;margin:10px 0 2px}
.cltrack i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.1)}
.cltrack i.on{background:var(--st)}
.clna{margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--st)}
.clna .na{font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.clna .meta{margin-top:6px}
/* payments calendar: month grid on a laptop, agenda list on a phone */
.pnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pnav button{padding:8px 14px}
.pgrid{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.pdow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.pdow span{padding:9px 10px;font:600 11px var(--mono);letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.pwk{position:relative;border-bottom:1px solid var(--line)}
.pwk:last-child{border-bottom:0}
.pdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.pday{position:relative;min-width:0;min-height:112px;padding:calc(32px + var(--nb,0) * 27px) 6px 8px;border-right:1px solid var(--line)}
.pday:last-child{border-right:0}
.pday .dn{position:absolute;top:7px;left:9px;font:600 13px var(--mono);color:#C3CCDA;line-height:20px}
.pday.wkend{background:rgba(255,255,255,.015)}
.pday.other{background:rgba(0,0,0,.22)}
.pday.other .dn{color:#45526A}
.pday.today{background:rgba(92,200,245,.06);box-shadow:inset 0 0 0 1px rgba(92,200,245,.35)}
.pday.today .dn{background:var(--accent);color:#06121F;border-radius:99px;padding:0 7px;left:6px}
.pbands{position:absolute;left:0;right:0;top:31px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:23px;row-gap:4px;pointer-events:none}
.pband{pointer-events:auto;margin:0 4px;border-radius:8px;background:linear-gradient(90deg,rgba(52,211,153,.07),rgba(52,211,153,.2) 50%,rgba(52,211,153,.07));border:1px dashed rgba(52,211,153,.6);color:#6EE7B7;font-size:12px;font-weight:600;padding:0 9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:21px}
.pband.late{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.55);color:var(--warn)}
.pband.cont{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:none;margin-left:0}
.pband.more{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:none;margin-right:0}
.pc{display:block;width:100%;text-align:left;margin-top:4px;padding:3px 7px;border-radius:7px;font-size:12px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;cursor:pointer;border:1px solid transparent;background:none;color:var(--text)}
.pc.out{background:rgba(248,113,113,.13);color:#FCA5A5;border-color:rgba(248,113,113,.32)}
.pc.in{background:rgba(52,211,153,.2);color:#A7F3D0;border-color:rgba(52,211,153,.5)}
.pc.mrr{background:transparent;color:var(--good);border-color:var(--good)}
.pc.mrr.late{color:var(--warn);border-color:var(--warn)}
.pc.nc{opacity:.55}
.pc:hover,.pband:hover,.arow:hover{filter:brightness(1.18)}
.pc .ck2,.arow .ck2,.pband .ck2{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin:0 0 1px 5px;vertical-align:middle}
.pkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 14px}
.pkey i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.pagenda{display:none}
.ad{margin-bottom:14px}
.ad h3{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:0 0 7px}
.arow{--c:var(--muted);display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);border-left:3px solid var(--c);background:var(--card2);color:var(--text);font-weight:500;margin-bottom:6px;cursor:pointer}
.arow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.arow .grow small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:1px}
.arow b{white-space:nowrap;font-variant-numeric:tabular-nums}
.arow.out{--c:var(--bad)}.arow.out b{color:#FCA5A5}
.arow.in{--c:var(--good);background:rgba(52,211,153,.1)}.arow.in b{color:var(--good)}
.arow.mrr{--c:var(--good);border-style:dashed;border-left-style:solid}.arow.mrr b{color:var(--good)}
.arow.exp{--c:var(--good);background:rgba(52,211,153,.06);border-style:dashed;border-left-style:solid}
.arow.late{--c:var(--warn)}
.prow{cursor:pointer}
.prow:hover b.nm{color:var(--accent)}
.ferr{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.ksub-if{display:block;color:var(--text);font-weight:600}
#td .td-meta label.chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-family:inherit;font-size:14px;color:var(--text)}
#td .td-meta label.chk input{width:18px;height:18px;padding:0;accent-color:var(--accent)}
#td .td-meta .full{grid-column:1 / -1}
@media (max-width:700px){.pgrid,.pkey{display:none}.pagenda{display:block}}

/* pipeline board (Notion): drag cards between status columns on a laptop, tap a card for Move to on a phone */
.pstate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-8px 0 14px}
.pstate.warn{color:var(--warn)}
.pstate .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px rgba(52,211,153,.6)}
.pstate.warn .dot{background:var(--warn);box-shadow:none}
.ptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ptools input{max-width:240px;padding:8px 12px;flex:1}
.wkbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0 6px}
.wkbar i{height:10px;border-radius:6px;background:rgba(255,255,255,.07)}
.wkbar i.on{background:var(--good);box-shadow:0 0 12px rgba(52,211,153,.4)}
.pboard{display:flex;align-items:stretch;gap:12px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pcol{flex:0 0 238px;display:flex;flex-direction:column;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;min-height:180px;transition:background .12s,border-color .12s}
.pcol.over{background:rgba(92,200,245,.08);border-color:rgba(92,200,245,.65)}
.pcol h3{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;margin:2px 2px 4px;font-family:var(--head)}
.pcol .tot{font:600 12px var(--mono);color:var(--muted);margin:0 2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcol .tot b{color:var(--good)}
.pcard{--st:var(--muted);padding:10px 11px;border:1px solid var(--line);border-left:3px solid var(--st);border-radius:12px;background:var(--card2);margin-bottom:8px;cursor:grab;user-select:none;-webkit-user-select:none;min-width:0;touch-action:pan-x pan-y}
.pcard:hover,.pcard:focus-visible{border-color:rgba(92,200,245,.45);border-left-color:var(--st);background:#19263F;outline:none}
.pcard.ro{cursor:pointer}
.pcard.dragging{opacity:.3}
.pcard.saving{opacity:.6}
.pcard b{display:block;font-size:14px;overflow-wrap:anywhere}
.pcard .who{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .val{font-weight:700;font-size:13px;color:var(--good);margin-top:6px;font-variant-numeric:tabular-nums}
.pcard .val.tbc{color:var(--muted);font-weight:600}
.pcard .nx{font-size:12.5px;line-height:1.4;color:#C3CCDA;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pcard .nx.none{color:var(--warn)}
.pcard .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pghost{position:fixed;z-index:120;pointer-events:none;width:226px;margin:0;transform:rotate(2deg);box-shadow:0 18px 44px rgba(0,0,0,.6);opacity:.96;cursor:grabbing}
body.pdragging,body.pdragging *{cursor:grabbing!important}
#pSheet{position:fixed;inset:0;z-index:80;display:none}
#pSheet.show{display:block}
#pSheet .psh-bg{position:absolute;inset:0;background:rgba(3,8,16,.62)}
#pSheet .psh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 24px));max-height:86vh;overflow:auto;background:#0F1828;border:1px solid rgba(92,200,245,.4);border-radius:16px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);overscroll-behavior:contain}
#pSheet .grab{display:none;width:44px;height:5px;border-radius:9px;background:#33415a;margin:-6px auto 12px}
#pSheet .psh-t{font-family:var(--head);font-size:19px;font-weight:700;display:block}
#pSheet .psh-v{font-weight:700;color:var(--good);margin:12px 0 6px;font-variant-numeric:tabular-nums}
#pSheet .psh-nx{font-size:14px;line-height:1.5;color:#D5DDEA;white-space:pre-wrap;overflow-wrap:anywhere}
#pSheet h4{margin:16px 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.psh-moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.psh-moves button{background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--line);border-left:3px solid var(--st);padding:9px 8px;font-size:13px;font-weight:600;text-align:left}
.psh-moves button.on{background:rgba(92,200,245,.14);border-color:var(--accent);border-left-color:var(--st)}
@media (max-width:700px){#pSheet .psh{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}#pSheet .grab{display:block}.pcol{flex-basis:78vw}.ptools input{max-width:none}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .side{transform:translateX(-105%);transition:transform .22s ease;width:min(290px,86vw);box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:90}
  body.menu .side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(3,6,12,.6);z-index:80}
  .content{margin-left:0;padding:16px 16px 48px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(10,15,26,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .topbar svg.logo{width:30px;height:30px;color:var(--hud)}
  .topbar b{font-family:var(--head);font-size:16px}
  .topbar .sp{flex:1}
  .topbar button{padding:8px 10px}
  .dash{grid-template-columns:minmax(0,1fr)}
  .phead h1{font-size:26px}
  .phead > button{display:none}
}
@media (max-width:520px){
  .bcol{flex-basis:82vw}
  .kpis{gap:10px;margin-bottom:12px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:22px}
  .kpi .lab{font-size:13px}
  .kpi .sub{margin-top:8px;padding-top:7px;font-size:12px}
  .phead{margin-bottom:14px}
  .quick{flex-wrap:wrap}
  .quick input{flex:1 1 100%}
  .quick select{flex:1;max-width:none!important}
  .card{padding:16px}
  .dpr{grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px}
  .dp-time{font-size:14px}
  .dp-stats{gap:8px}
  .dp-stats > div{padding:9px 10px}
  .dp-stats b{font-size:17px}
  .dp-wide{display:none}
  .dp-btns{gap:6px}
  .dp-btns button{padding:6px 10px}
  .dp-narrow{display:inline}
  .pad{grid-template-columns:repeat(3,68px)}
  .pad button{height:68px}
  .hudrow{grid-template-columns:1fr 1fr}
  input[type=number]{width:80px}
  .grid-auto{grid-template-columns:minmax(0,1fr)}
}

const gbp = n => "£" + Math.round(Number(n || 0)).toLocaleString("en-GB");
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const sum = (rows, f) => rows.reduce((a, r) => a + Number(r[f] || 0), 0);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const canHover = () => matchMedia("(hover: hover) and (pointer: fine)").matches;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400); }
async function q(p){ const { data, error } = await p; if (error) { toast(error.message); throw error; } return data; }
function show(id){ ["login","lock","boot","app"].forEach(x => $("#" + x).classList.toggle("hide", x !== id)); if (id !== "app") closeTask(); }

/* payments tables (hq_costs, hq_expected) load softly: until migration hq_v34_payments is applied the rest of HQ still works */
async function qSoft(p, flag){ const { data, error } = await p; if (error) { S[flag] = true; return []; } return data || []; }
async function loadAll(){
  const since = addDays(today(), -13);
  S.payMissing = false;
  const [costs, expected] = await Promise.all([
    qSoft(sb.from("hq_costs").select("*").order("created_at"), "payMissing"),

  ]);
  Object.assign(S, { costs, expected });
  const [tasks, notes, deals, invoices, cash, debts, plan, outreach, st, touches, calls, assets, li] = await Promise.all([

    q(sb.from("hq_debt_plan").select("*").order("sort")),
    q(sb.from("hq_outreach").select("*").gte("day", since)),

/* ---------- money rules ----------
   MRR = monthly fees from signed customers (Jack, 18 Nov: George's £199 counts from signing). Each month opens at MRR.
   Won = contract value signed this month. Cash collected = money banked; only this counts to £25k.
   Invoiced, not paid = shown apart, never counted as cash. */
function money(s = S, d = today()){
  const m = d.slice(0, 7);
  const counted = s.cash.filter(c => c.counts);
  const sent = s.invoices.filter(i => i.status === "sent");
  const scheduled = s.invoices.filter(i => i.status === "scheduled");
  const signed = s.deals.filter(x => SIGNED_STAGES.includes(x.stage));
  const notLive = signed.filter(x => x.stage !== "Live" && Number(x.monthly));
  const target = Number(s.settings.target || 25000);
  const cashTotal = sum(counted, "amount");
  const pipe = s.deals.filter(inPipe).sort((a, b) => (Number(b.value || 0) - Number(a.value || 0)) || String(a.next_date || "9999").localeCompare(String(b.next_date || "9999")));
  const wonDeals = s.deals.filter(x => dealStatus(x) === "Won");
  return {
    mrr: sum(signed, "monthly"),
    liveMrr: sum(s.deals.filter(x => x.stage === "Live"), "monthly"),
    nextLive: notLive.map(x => x.live_on).filter(Boolean).sort()[0] || null,
    customers: signed.filter(x => Number(x.monthly)).length,
    won: sum(s.deals.filter(x => x.won_on && x.won_on.slice(0, 7) === m && x.stage !== "Lost"), "value"),
    cashMonth: sum(counted.filter(c => String(c.date).slice(0, 7) === m), "amount"),
    cashTotal,
    unpaid: sum(sent, "amount"), unpaidCount: sent.length,
    scheduled: sum(scheduled, "amount"),
    pipeline: sum(pipe, "value"), pipeMonthly: sum(pipe, "monthly"), pipeDeals: pipe,
    openDeals: pipe.length, pipeTbc: pipe.filter(x => !Number(x.value)).length,
    wonDeals, wonValue: sum(wonDeals, "value"), wonMonthly: sum(wonDeals, "monthly"),
    debtsLeft: s.debts.reduce((a, r) => a + Math.max(0, Number(r.amount) - Number(r.paid)), 0),
    target, pct: Math.min(100, Math.round(100 * cashTotal / (target || 1))),
  };
}

/* ---------- CRM helpers ---------- */
const CRM_STATUSES = ["Uncontacted","Cold","Warm","Hot","Call booked","Proposal Sent","Won","Lost"];
const STC = { Uncontacted: "#6B7A93", Cold: "#60A5FA", Warm: "#FBBF24", Hot: "#FB923C", "Call booked": "#A78BFA", "Proposal Sent": "#5CE1FF", Won: "#34D399", Renewal: "#34D399", Lost: "#F87171" };
const STAGE_FROM = { "Call booked": "Demo booked", "Proposal Sent": "Proposal sent", Hot: "Spoken", Warm: "Spoken", Cold: "Lead", Uncontacted: "Lead", Lost: "Lost" };
const daysBetween = (a, b) => Math.round((new Date(String(b).slice(0, 10) + "T12:00:00") - new Date(String(a).slice(0, 10) + "T12:00:00")) / 864e5);
function dealStatus(x){ return x.status || ({ "Demo booked": "Call booked", "Demo done": "Hot", "Proposal sent": "Proposal Sent", Won: "Won", Building: "Won", Live: "Won", Lost: "Lost", Spoken: "Warm" }[x.stage] || "Cold"); }
function isOpen(x){ return !["Won","Renewal","Lost"].includes(dealStatus(x)); }
/* Pipeline = open deals not yet won: any open deal with a value, plus every Hot, Call booked or Proposal Sent deal (value TBC until priced). */
const PIPE_STATUSES = ["Hot","Call booked","Proposal Sent"];
function inPipe(x){ return isOpen(x) && (Number(x.value) > 0 || Number(x.monthly) > 0 || PIPE_STATUSES.includes(dealStatus(x))); }
const PIPE_LAB = "Pipeline: open deals not yet won";
function cashSub(m, s = S){
  if (m.unpaid) return `${gbp(m.unpaid)} invoiced, not paid`;
  const sch = s.invoices.filter(i => i.status === "scheduled");
  if (sch.length === 1) return `${esc(sch[0].number)} ${gbp(sch[0].amount)} due ${sch[0].trigger ? esc(sch[0].trigger) : fmtDay(sch[0].due_on)}`;
  return sch.length ? `${gbp(m.scheduled)} scheduled` : "nothing unpaid";
}
function pipeSub(m){ return `${m.openDeals} ${m.openDeals === 1 ? "deal" : "deals"}${m.pipeTbc ? `, ${m.pipeTbc} value TBC` : ""}${m.pipeMonthly ? `, + ${gbp(m.pipeMonthly)}/mo` : ""}`; }
function valTxt(x){ return Number(x.value) ? gbp(x.value) + (Number(x.monthly) ? ` + ${gbp(x.monthly)}/mo` : "") : (Number(x.monthly) ? gbp(x.monthly) + "/mo" : "TBC"); }
function pipeCard(m, id){
  const row = x => `<li class="dcrow" data-deal="${x.id}"><span class="grow pname"><b>${esc(x.company)}</b> <span class="muted small">${esc(x.contact || "")}</span><span class="muted small" style="display:block;margin-top:2px">${esc(dealStatus(x))}${x.next_date ? ", next " + fmtDay(x.next_date) : ""}</span></span><b class="num" style="white-space:nowrap">${valTxt(x)}</b></li>`;

    <li class="pipetot"><span class="grow"><b>Pipeline total</b></span><b class="num" style="color:var(--hud)">${gbp(m.pipeline)}${m.pipeMonthly ? ` + ${gbp(m.pipeMonthly)}/mo` : ""}</b></li></ul>
    ${m.wonDeals.length ? `<div class="eyebrow" style="margin:14px 0 2px">Won, not in the pipeline</div><ul class="lines">${m.wonDeals.map(x => `<li class="dcrow" data-deal="${x.id}"><span class="grow pname"><b>${esc(x.company)}</b> <span class="muted small">${esc(x.contact || "")}</span></span><b class="num" style="color:var(--good);white-space:nowrap">${valTxt(x)}</b></li>`).join("")}</ul>` : ""}</div>`;

function followUps(s = S, d = today()){
  const act = s.deals.filter(x => x.next_date && !["Lost","Uncontacted"].includes(dealStatus(x)));
  const by = (a, b) => String(a.next_date).localeCompare(String(b.next_date)) || String(a.company).localeCompare(String(b.company));
  return { due: act.filter(x => x.next_date <= d).sort(by), soon: act.filter(x => x.next_date > d && x.next_date <= addDays(d, 7)).sort(by) };

/* ---------- tasks helpers ---------- */
const ORD = { running: 0, todo: 1, waiting: 2, scheduled: 3, done: 4 };
const doneDay = t => t.done_at ? iso(t.done_at) : null;
/* LinkedIn post reminders (LinkedIn/POSTING_SCHEDULE.md): kept out of the normal lists, shown as "Next LinkedIn post" */
const isPost = t => t.kind === "li_post";
function nextPost(s = S){ return s.tasks.filter(t => isPost(t) && t.status !== "done").sort((a, b) => (String(a.due) + (a.due_time || "")).localeCompare(String(b.due) + (b.due_time || "")))[0] || null; }
function weekStart(d){ const wd = (new Date(d + "T12:00:00").getDay() + 6) % 7; return addDays(d, -wd); }
function postsThisWeek(s = S, d = today()){
  const ws = weekStart(d), we = addDays(ws, 6);
  const wk = s.tasks.filter(t => isPost(t) && ((t.due >= ws && t.due <= we) || (t.status === "done" && doneDay(t) >= ws && doneDay(t) <= we)));
  return { done: wk.filter(t => t.status === "done" && doneDay(t) >= ws && doneDay(t) <= we).length, planned: wk.length, list: wk.sort((a, b) => (String(a.due) + (a.due_time || "")).localeCompare(String(b.due) + (b.due_time || ""))) };
}
function postBody(t){ const n = t.notes || "", i = n.indexOf("\n\n"); return (i >= 0 ? n.slice(i + 2) : n).split(/\n\nVisual:/)[0].trim(); }
function postCard(t){
  if (!t) return '<div class="empty">No posts scheduled. Add the next ones to LinkedIn/POSTING_SCHEDULE.md.</div>';
  const when = t.due ? `${t.due === today() ? "Today" : fmtDay(t.due)}${t.due_time ? " " + String(t.due_time).slice(0, 5) + " UK" : ""}` : "";
  return taskCard(t, { compact: true }) + `<div class="postprev" id="postPrev">${esc(postBody(t))}</div>
    <div class="btnrow"><button class="sm" id="postDone" data-post="${t.id}">Mark posted</button><button class="btn" id="postCopy" data-post="${t.id}">Copy text</button><span class="muted small" style="align-self:center">${esc(when)}, from the content bank. Claude posts only on your "post it".</span></div>`;
}
function bindPostCard(){
  const b = $("#postDone"), c = $("#postCopy");
  if (b) b.onclick = async () => { const t = S.tasks.find(x => x.id === b.dataset.post); await setTask(t, { status: "done", done_at: new Date().toISOString() }); toast("Posted: " + t.title.replace(/^LinkedIn post: /, "")); rerender(); };
  if (c) c.onclick = () => { const t = S.tasks.find(x => x.id === c.dataset.post); (navigator.clipboard ? navigator.clipboard.writeText(postBody(t)) : Promise.reject()).then(() => toast("Post text copied"), () => toast("Copy failed, open the card to select it")); };
}
function todayTasks(s = S, d = today()){
  return s.tasks.filter(t => !isPost(t)).filter(t =>
      (t.status === "done" && doneDay(t) === d) ||
      (t.status !== "done" && t.due && t.due <= d) ||
      (t.status === "running") ||
      (t.status === "waiting" && !t.due))
    .sort((a, b) => (ORD[a.status] - ORD[b.status]) || String(a.due_time || "99").localeCompare(String(b.due_time || "99")) || a.sort - b.sort);
}
function todayCounts(s = S, d = today()){
  const all = todayTasks(s, d), open = all.filter(t => t.status !== "done");
  return { total: all.length, open: open.length, calls: open.filter(t => /call|demo/i.test(t.title)).length, done: all.length - open.length };
}
function statusChip(t){
  if (t.status === "running") return `<span class="chip hud run"><span class="stdot"></span>Running</span>`;
  if (t.status === "waiting") return `<span class="chip warn">Waiting on ${esc(t.waiting_on || "Jack")}</span>`;
  if (t.status === "scheduled") return `<span class="chip violet">Scheduled</span>`;
  if (t.status === "done") return `<span class="chip good">Done</span>`;
  return `<span class="chip">To do</span>`;
}
function dueChip(t, d = today()){
  if (!t.due) return "";
  const tm = t.due_time ? " " + String(t.due_time).slice(0, 5) : "";
  if (t.status !== "done" && t.due < d) { const n = Math.round((new Date(d) - new Date(t.due)) / 864e5); return `<span class="chip bad">Overdue ${n}d</span>`; }
  if (t.due === d) return `<span class="chip hud">Today${tm}</span>`;
  if (t.due === addDays(d, 1)) return `<span class="chip">Tomorrow${tm}</span>`;
  return `<span class="chip">${fmtDay(t.due)}${tm}</span>`;
}
const notesFor = id => S.notes.filter(n => n.task_id === id);

    </div></div>`;

async function setTask(t, v){
  await q(sb.from("hq_tasks").update(v).eq("id", t.id)); Object.assign(t, v);
}
async function toggleDone(t){
  const v = t.status === "done" ? { status: "todo", done_at: null } : { status: "done", done_at: new Date().toISOString() };
  await setTask(t, v); toast(v.status === "done" ? "Done: " + t.title : "Back on the list");
  rerender();

async function addTask(row){
  row.sort = Math.max(0, ...S.tasks.map(t => t.sort || 0)) + 1;
  if (row.status === "waiting" && !row.waiting_on) row.waiting_on = "Jack";
  const created = await q(sb.from("hq_tasks").insert(row).select().single());
  S.tasks.push(created); toast("Added: " + row.title); return created;
}

/* task cards: tick button, click or tap opens the detail card, hover previews it on a laptop */
const TD = { kind: "task", id: null, pinned: false, hoverT: 0, leaveT: 0, editDesc: false };
document.addEventListener("click", async e => {
  const ck = e.target.closest(".tc [data-act=tick]");
  if (ck) { e.stopPropagation(); const t = S.tasks.find(x => x.id === ck.closest(".tc").dataset.id); if (t) await toggleDone(t); return; }
  const tc = e.target.closest(".tc");
  if (tc) { openCard("task", tc.dataset.id, tc, true); return; }
  const pc = e.target.closest("[data-pchip]");
  if (pc && !e.target.closest("#td")) { openCard("pay", pc.dataset.pchip, pc, true); return; }
  const ap = e.target.closest("[data-addpipe]");
  if (ap) { e.stopPropagation(); const box = ap.closest("[data-addp]") || ap.parentElement; box.innerHTML = `<span class="muted small">Add as</span>${PIPE_IN.map(s => `<button class="ghost sm" data-pipeto="${s}" data-pid="${ap.dataset.addpipe}">${s}</button>`).join("")}`; return; }
  const pt = e.target.closest("[data-pipeto]");
  if (pt) { e.stopPropagation(); const x = S.deals.find(y => y.id === pt.dataset.pid); if (x) { pt.disabled = true; await addToPipeline(x, pt.dataset.pipeto); } return; }
  const dd = e.target.closest("[data-deal]");
  if (dd && !e.target.closest("#td")) { if (e.target.closest("a")) return; openCard("deal", dd.dataset.deal, dd.matches(".dc, .dcrow") ? dd : null, true); return; }
  if (!e.target.isConnected) return; // the card redrew itself under this click (e.g. Edit), so it was inside
  if (TD.id && !e.target.closest("#td") && !e.target.closest("#tdBack")) closeTask();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && TD.id) return closeTask();
  const tc = e.target.closest && e.target.closest(".tc, .dc");
  if (tc && e.key === "Enter" && e.target === tc) openCard(tc.classList.contains("dc") ? "deal" : "task", tc.dataset.id || tc.dataset.deal, tc, true);
});
document.addEventListener("mouseover", e => {
  if (!canHover()) return;
  const tc = e.target.closest(".tc, .dc"), inTd = e.target.closest("#td");
  const kid = tc && (tc.dataset.id || tc.dataset.deal);
  if (inTd || (tc && kid === TD.id)) { clearTimeout(TD.leaveT); return; }
  if (tc) { clearTimeout(TD.hoverT); clearTimeout(TD.leaveT); TD.hoverT = setTimeout(() => { if (!TD.pinned) openCard(tc.classList.contains("dc") ? "deal" : "task", kid, tc, false); }, 320); } // moving card to card: keep the open one until the next shows
});
document.addEventListener("mouseout", e => {
  if (!canHover()) return;
  const from = e.target.closest(".tc, .dc, #td"), to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".tc, .dc, #td");
  if (from && from.matches(".tc, .dc")) clearTimeout(TD.hoverT);
  if (from && from !== to && !(to && to.matches(".tc, .dc")) && TD.id && !TD.pinned) { clearTimeout(TD.leaveT); TD.leaveT = setTimeout(() => { if (!TD.pinned) closeTask(); }, 260); }
});
$("#td").addEventListener("focusin", () => { TD.pinned = true; });
$("#tdBack").onclick = () => closeTask();
function openCard(kind, id, anchor, pin){
  if (kind === "pay" ? !payRef(id) : !(kind === "deal" ? S.deals : S.tasks).some(x => x.id === id)) return;
  const same = TD.id === id && TD.kind === kind;
  if (!same) TD.editDesc = false;
  TD.pinned = (same && TD.pinned) || !!pin; TD.id = id; TD.kind = kind;
  document.querySelectorAll(".tc.open, .dc.open").forEach(x => x.classList.remove("open"));
  if (anchor) anchor.classList.add("open");
  drawCard();
  const td = $("#td"); td.classList.remove("hide");
  const sheet = !canHover() || innerWidth < 700;
  td.classList.toggle("sheet", sheet);
  $("#tdBack").classList.toggle("hide", !sheet);
  if (!sheet && anchor) {
    const r = anchor.getBoundingClientRect(), w = Math.min(390, innerWidth - 24), h = td.offsetHeight;
    let left = r.right + 12; if (left + w > innerWidth - 12) left = Math.max(12, r.left - w - 12);
    if (left < 12 || (r.left - w - 12 < 12 && r.right + 12 + w > innerWidth - 12)) left = Math.max(12, Math.min(innerWidth - w - 12, r.left));
    let top = Math.min(Math.max(12, r.top - 8), innerHeight - h - 12);
    td.style.left = left + "px"; td.style.top = Math.max(12, top) + "px";
  } else if (!sheet) { td.style.left = Math.max(12, innerWidth - Math.min(390, innerWidth - 24) - 24) + "px"; td.style.top = "24px"; }
}
const openTask = (id, anchor, pin) => openCard("task", id, anchor, pin);
function drawCard(){ return TD.kind === "deal" ? drawDeal() : TD.kind === "pay" ? drawPay() : drawTask(); }
function closeTask(){
  TD.id = null; TD.pinned = false; TD.editDesc = false; clearTimeout(TD.hoverT); clearTimeout(TD.leaveT);
  const td = $("#td"); if (!td) return; td.classList.add("hide"); td.innerHTML = ""; $("#tdBack").classList.add("hide");
  document.querySelectorAll(".tc.open, .dc.open").forEach(x => x.classList.remove("open"));
}
function fmtDesc(s, empty = "No description yet."){
  if (!s) return '<span class="muted">' + empty + '</span>';
  const out = []; let list = [];
  const flush = () => { if (list.length) { out.push("<ul>" + list.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>"); list = []; } };
  s.split("\n").forEach(l => { const m = l.match(/^\s*[-*•]\s+(.*)/); if (m) list.push(m[1]); else { flush(); out.push(esc(l)); } });
  flush(); return out.join("\n").replace(/\n(<ul>)/g, "$1").replace(/(<\/ul>)\n/g, "$1");
}

async function pinRow(){ const r = await q(sb.from("hq_pin").select("*").limit(1)); return r[0] || null; }
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pinDerive(pin, salt, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin + ":" + ME.id), "PBKDF2", false, ["deriveBits"]);
  return b64e(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, key, 256));
}
async function pinMake(pin){ const salt = crypto.getRandomValues(new Uint8Array(16)); return `pbkdf2-sha256$${PIN_ITER}$${b64e(salt)}$${await pinDerive(pin, salt, PIN_ITER)}`; }
async function pinCheck(pin, stored){
  const [, iter, salt, hash] = String(stored).split("$");
  const got = await pinDerive(pin, b64d(salt), Number(iter));
  let diff = got.length ^ hash.length; for (let i = 0; i < Math.min(got.length, hash.length); i++) diff |= got.charCodeAt(i) ^ hash.charCodeAt(i);
  return diff === 0;
}
const PIN = { mode: "enter", entry: "", first: "", busy: false };
function showLock(mode){
  PIN.mode = mode; PIN.entry = ""; PIN.first = "";
  $("#pinTitle").textContent = mode === "set" ? "Choose a 4 digit PIN" : "Enter PIN";
  $("#pinMsg").textContent = mode === "set" ? "Opens HQ on this device from now on." : "";
  $("#pinForgot").classList.toggle("hide", mode === "set");
  document.body.classList.remove("menu");
  drawDots(); show("lock");
}
function drawDots(){ $("#pinDots").innerHTML = [0,1,2,3].map(i => `<i class="${i < PIN.entry.length ? "on" : ""}"></i>`).join(""); }
function pinFail(msg){ PIN.entry = ""; drawDots(); $("#pinMsg").textContent = msg; const d = $("#pinDots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); }
$("#pinPad").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","del"].map(k => k === "" ? `<button class="blank" tabindex="-1" aria-hidden="true"></button>` : k === "del" ? `<button class="fn" data-k="del" aria-label="Delete">Delete</button>` : `<button data-k="${k}">${k}</button>`).join("");
$("#pinPad").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) pinKey(b.dataset.k); });
document.addEventListener("keydown", e => {
  if ($("#lock").classList.contains("hide")) return;
  if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === "Backspace") pinKey("del");
});
$("#pinForgot").onclick = () => signOut("Sign in with your password, then choose a PIN if you want a new one.");
async function pinKey(k){
  if (PIN.busy) return;
  if (k === "del") { PIN.entry = PIN.entry.slice(0, -1); return drawDots(); }
  if (PIN.entry.length >= 4) return;
  PIN.entry += k; drawDots();
  if (PIN.entry.length < 4) return;
  PIN.busy = true;
  try {
    if (PIN.mode === "set") {
      if (!PIN.first) { PIN.first = PIN.entry; PIN.entry = ""; $("#pinTitle").textContent = "Confirm PIN"; $("#pinMsg").textContent = ""; drawDots(); return; }
      if (PIN.first !== PIN.entry) { PIN.first = ""; $("#pinTitle").textContent = "Choose a 4 digit PIN"; return pinFail("Didn't match. Try again."); }
      const pin_hash = await pinMake(PIN.entry);
      await q(sb.from("hq_pin").upsert({ owner: ME.id, pin_hash }, { onConflict: "owner" }));
      store.del("hq.pinFails"); toast("PIN set"); unlockAndBoot();
    } else {
      const row = await pinRow();
      if (!row) return showLock("set");
      if (await pinCheck(PIN.entry, row.pin_hash)) { store.del("hq.pinFails"); unlockAndBoot(); }
      else {
        const fails = Number(store.get("hq.pinFails") || 0) + 1; store.set("hq.pinFails", String(fails));
        if (fails >= PIN_MAX_FAILS) { store.del("hq.pinFails"); return signOut("Too many wrong PINs. Sign in with your password."); }
        pinFail(`Wrong PIN. ${PIN_MAX_FAILS - fails} ${PIN_MAX_FAILS - fails === 1 ? "try" : "tries"} left.`);
      }
    }
  } catch (err) { pinFail("Couldn't check the PIN: " + (err.message || err)); }
  finally { PIN.busy = false; }
}

/* boot: monogram + sweep, car draws while the HUD counts up. Tap skips. Reduced motion shows the finished frame. */
const BOOT = { timer: 0, raf: 0, done: null, ended: false };
function hudTiles(s){
  const m = money(s), c = todayCounts(s);
  return [
    { v: m.mrr, label: "MRR", sub: m.nextLive && !m.liveMrr ? "starts " + fmtDay(m.nextLive) : m.customers + (m.customers === 1 ? " customer" : " customers") },
    { v: m.cashMonth, label: "Cash this month", sub: m.unpaid ? gbp(m.unpaid) + " not paid yet" : "collected" },
    { v: m.pipeline, label: "Pipeline", sub: "open, not yet won" },
    { v: c.open, label: "Today", sub: c.open + " tasks, " + c.calls + (c.calls === 1 ? " call" : " calls"), plain: true },
  ];
}
function drawHud(tiles, frac){
  // tiles are built once per boot so their fade-in runs once; each frame only the numbers change
  const box = $("#bootHud"), e = 1 - Math.pow(1 - frac, 3);
  if (box.children.length !== tiles.length) box.innerHTML = tiles.map(() => `<div><span></span><b></b><small></small></div>`).join("");
  tiles.forEach((t, i) => {
    const el = box.children[i];
    el.children[0].textContent = t.label;
    el.children[1].textContent = t.plain ? Math.round(t.v * e) : gbp(t.v * e);
    el.children[2].textContent = t.sub;
  });
}
function greet(){ const h = new Date().getHours(); return h < 12 ? "Morning" : h < 18 ? "Afternoon" : "Evening"; }
function unlockAndBoot(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const boot = $("#boot");
  BOOT.ended = false; boot.className = ""; show("boot");
  $("#bootHello").textContent = greet() + " Jack. Systems online.";
  drawHud(hudTiles(S), 0);
  const data = loadAll().catch(() => S);
  let tiles = null; data.then(s => { tiles = hudTiles(s); });
  const finish = () => {
    if (BOOT.ended) return; BOOT.ended = true;
    clearTimeout(BOOT.timer); cancelAnimationFrame(BOOT.raf);
    boot.classList.add("still");
    data.then(s => { drawHud(hudTiles(s), 1); boot.classList.add("out"); setTimeout(() => { boot.className = "hide"; startApp(); }, reduce ? 0 : 320); });
  };
  BOOT.done = finish;
  if (reduce) { boot.classList.add("still"); data.then(s => drawHud(hudTiles(s), 1)); BOOT.timer = setTimeout(finish, 1200); return; }
  void boot.offsetWidth; boot.classList.add("go");
  const t0 = performance.now(), countStart = 1250, countLen = 1750;
  const tick = now => {
    const el = now - t0;
    if (el >= countStart && tiles) drawHud(tiles, Math.min(1, (el - countStart) / countLen));
    if (el < countStart + countLen) BOOT.raf = requestAnimationFrame(tick);
  };
  BOOT.raf = requestAnimationFrame(tick);
  BOOT.timer = setTimeout(finish, 3500);
}

/* ---------- PIPELINE (Notion Pipeline DB, the CRM's source of truth) ----------

const PIPE_COLS = ["Cold","Warm","Hot","Call booked","Proposal Sent","Won","Renewal","Lost"];

async function pipeCall(body){

    const e = new Error(error.message || "Request failed");

function drawPipe(){

   Built from data HQ already holds: tasks with a due date (calls and demos stand out), deal follow-ups,
   go-live dates and invoice due dates. Month grid on a laptop, agenda list on a phone (same CSS as Payments). */
const CALV = { ym: null };
const isMeet = t => { const x = t.title || ""; if (/run-through|prep|tell claude|whatsapp|chase|check|send|questions|diary|open, demo window/i.test(x)) return false; return /\bdemo\b|walkthrough|meeting|sit-down/i.test(x) || (/\bcall\b/i.test(x) && !!t.due_time); };
function calItems(s = S, from, to, d = today()){
  const out = [], inR = x => x && x >= from && x <= to;
  s.tasks.filter(t => t.due && inR(t.due) && !isPost(t)).forEach(t => out.push({ type: t.status === "done" ? "done" : isMeet(t) ? "meet" : (t.due < d ? "late" : "task"), date: t.due, time: t.due_time ? String(t.due_time).slice(0, 5) : "", label: t.title, attr: `data-id="${t.id}"`, cls: "tcal", proj: t.project }));
  s.tasks.filter(t => t.due && inR(t.due) && isPost(t) && t.status !== "done").forEach(t => out.push({ type: "post", date: t.due, time: t.due_time ? String(t.due_time).slice(0, 5) : "", label: t.title.replace(/^LinkedIn post: /, "Post: "), attr: `data-id="${t.id}"`, cls: "tcal" }));
  s.deals.filter(x => x.next_date && inR(x.next_date) && !["Lost", "Uncontacted"].includes(dealStatus(x))).forEach(x => out.push({ type: "fu", date: x.next_date, time: x.next_time ? String(x.next_time).slice(0, 5) : "", label: "Follow up " + x.company, attr: `data-deal="${x.id}"` }));
  s.deals.filter(x => x.live_on && inR(x.live_on) && x.live_on >= d).forEach(x => out.push({ type: "live", date: x.live_on, time: "", label: "Go-live " + x.company, attr: `data-deal="${x.id}"` }));
  s.invoices.filter(i => i.due_on && inR(i.due_on) && i.status !== "paid").forEach(i => out.push({ type: "money", date: i.due_on, time: "", label: `${i.number} ${gbp(i.amount)} due, ${i.client}`, attr: "" }));
  const ord = { meet: 0, late: 1, task: 2, fu: 3, live: 4, money: 5, post: 6, done: 7 };
  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.time || "99").localeCompare(b.time || "99") || ord[a.type] - ord[b.type]);
}
function calDeadlines(s = S, d = today()){

/* ---------- CLIENTS (Jack, 24 Nov): one card per client, build or live lead; leads that don't buy are archived, never deleted ----------
   Each client's full brief lives in apexlineai.com/Clients/<Name - Company>/CLAUDE.md on the Mac. */
const CLV = { show: "active" };
function clientGroup(x){
  const st = dealStatus(x);
  if (st === "Won" || st === "Renewal" || SIGNED_STAGES.includes(x.stage)) return "won";
  if (st === "Lost") return "arch";
  if (["Hot", "Call booked", "Proposal Sent"].includes(st)) return "hot";
  if (st === "Warm" && (Number(x.value) > 0 || Number(x.monthly) > 0)) return "warm";
  return null;
}
function clientTasks(x){
  const keys = [x.contact, x.company].filter(Boolean).map(k => String(k).split(/[\s(,]/)[0].toLowerCase()).filter(k => k.length > 2);
  return S.tasks.filter(t => t.status !== "done" && !isPost(t) && keys.some(k => (t.title || "").toLowerCase().includes(k))).sort((a, b) => String(a.due || "9999").localeCompare(String(b.due || "9999")) || String(a.due_time || "99").localeCompare(String(b.due_time || "99")));
}
/* money per client (Jack, 24 Nov): build value, cash collected from paid invoices, still to come, monthly and a year of it, and where it is on the road to live */
const CL_STEPS = ["Lead", "Demo", "Proposal", "Deposit", "Building", "Live"];
function clientMoney(x){
  const invs = S.invoices.filter(i => i.deal_id === x.id && i.status !== "void");
  const paid = invs.filter(i => i.status === "paid"), due = invs.filter(i => i.status !== "paid");
  const collected = paid.reduce((a, i) => a + Number(i.amount || 0), 0);
  const build = Number(x.value || 0), mo = Number(x.monthly || 0);
  const next = due.sort((a, b) => String(a.due_on || "9999").localeCompare(String(b.due_on || "9999")))[0] || null;
  const st = dealStatus(x), sg = String(x.stage || "").toLowerCase(), d = today();
  let step = 0;
  if (/demo/.test(sg)) step = 1;
  if (/demo done|proposal/.test(sg) || st === "Proposal Sent") step = 2;
  if (collected > 0 || st === "Won" || st === "Renewal") step = 3;
  if (sg === "building") step = 4;
  if (sg === "live" || (x.live_on && x.live_on <= d && (st === "Won" || st === "Renewal"))) step = 5;
  return { collected, build, mo, toCome: Math.max(0, build - collected), next, step, label: step === 1 && /booked/.test(sg) ? "Demo booked" : CL_STEPS[step] };
}

  let run = 0; const cum = byDay.map(v => (run += v));
  const max = Math.max(1000, ...cum), W = 600, H = 150;
  const pts = cum.map((v, i) => [n === 1 ? W : (i / (n - 1)) * W, H - 10 - (v / max) * (H - 24)]);
  const line = pts.map(p => p.map(x => x.toFixed(1)).join(",")).join(" ");

    <polygon points="0,${H} ${line} ${W},${H}" fill="url(#cg)"/><polyline points="${line}" fill="none" stroke="#5CC8F5" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- PAYMENTS (calendar) ----------
   Money out = recurring costs (hq_costs) on their day of the month. Money in landed = hq_cash (the same rows Money banks, never copied).
   MRR due = signed deals with a monthly fee and a billing day (1st or 15th), from go-live, until that month's MRR lands.
   Expected = pipeline payments (hq_expected) drawn as a band across their window, counted in the month of their expected date.
   Net this month = landed minus out. "If expected lands" adds expected pipeline payments and MRR still due. */
const CURR = { GBP: "£", USD: "$", EUR: "€" };
const COST_CATS = ["Software","AI","Outreach","Hosting","Domain","Admin","Other"];
const EXP_KINDS = [["build","Build payment"],["deposit","Deposit"],["mrr","Monthly fee"],["other","Other"]];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const PORD = { in: 0, mrr: 1, out: 2, exp: 3 };
const PV = { ym: null };
const pad2 = n => String(n).padStart(2, "0");
const lastDay = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const ymAdd = (ym, n) => { const x = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1); return x.getFullYear() + "-" + pad2(x.getMonth() + 1); };
const monthName = ym => MONTHS[+ym.slice(5, 7) - 1] + " " + ym.slice(0, 4);
const dayOrd = n => n + ((n % 10 === 1 && n !== 11) ? "st" : (n % 10 === 2 && n !== 12) ? "nd" : (n % 10 === 3 && n !== 13) ? "rd" : "th");
const shortMon = d => MONTHS[+d.slice(5, 7) - 1].slice(0, 3);
const shortName = s => String(s || "").trim().split(/\s+/)[0] || "";
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || "") && !isNaN(new Date(v + "T12:00:00"));
const numOrNull = v => v === "" || v == null ? null : Number(v);
const money0 = (n, c = "GBP") => { const v = Math.round(Number(n || 0) * 100) / 100, t = (CURR[c] || c + " ") + Math.abs(v).toLocaleString("en-GB", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); return v < 0 ? "-" + t : t; };
function rangeTxt(a, b){
  if (a === b) return +a.slice(8) + " " + shortMon(a);
  return a.slice(0, 7) === b.slice(0, 7) ? `${+a.slice(8)} to ${+b.slice(8)} ${shortMon(b)}` : `${+a.slice(8)} ${shortMon(a)} to ${+b.slice(8)} ${shortMon(b)}`;
}
function toGbp(s, amount, cur){
  if (amount == null || amount === "") return null;
  if (!cur || cur === "GBP") return Number(amount);
  const r = Number(((s.settings || {}).fx || {})[cur]);
  return r > 0 ? Number(amount) * r : null;
}
/* every payment touching the days from..to (ISO dates, inclusive) */
function payItems(s, from, to, d = today()){
  const out = [], costs = s.costs || [], cash = s.cash || [], exp = s.expected || [], deals = s.deals || [];
  for (let ym = from.slice(0, 7); ym <= to.slice(0, 7); ym = ymAdd(ym, 1)) {
    for (const c of costs) {
      if (c.active === false || !c.day_of_month) continue;
      if (c.cadence === "yearly" && Number(c.month_of_year) !== +ym.slice(5, 7)) continue;
      const date = ym + "-" + pad2(Math.min(Number(c.day_of_month), lastDay(ym)));
      if (date < from || date > to || (c.starts_on && date < c.starts_on) || (c.ends_on && date > c.ends_on)) continue;
      const amount = c.amount == null || c.amount === "" ? null : Number(c.amount);
      out.push({ id: `c:${c.id}:${date}`, type: "out", date, name: c.name, amount, currency: c.currency || "GBP", gbp: toGbp(s, amount, c.currency), row: c });
    }
    for (const x of deals) {
      if (!SIGNED_STAGES.includes(x.stage) || !(Number(x.monthly) > 0) || ![1, 15].includes(Number(x.bill_day))) continue;
      const date = ym + "-" + pad2(Number(x.bill_day));

    net: r2(landed - out), ifLands: r2(landed + expected - out),
    unpriced: outs.filter(i => i.amount == null), unconverted: outs.filter(i => i.amount != null && i.gbp == null),

}
function payWeek(s = S, d = today()){

/* "£35 + $25": pounds, plus any currency with no rate set yet. Costs with no amount are left out (they show "to check"). */
function outTxt(items){

  items.filter(i => i.amount != null && i.gbp == null).forEach(i => { oth[i.currency] = (oth[i.currency] || 0) + i.amount; });
  const parts = g || !Object.keys(oth).length ? [money0(g)] : [];

function validCost(v){
  if (!v.name) return "Add a name";
  if (v.amount != null && !(v.amount > 0 && v.amount < 100000)) return "Amount must be more than 0 (or leave it blank to check later)";
  if (!CURR[v.currency]) return "Pick a currency";
  if (!["monthly","yearly"].includes(v.cadence)) return "Pick monthly or yearly";
  if (v.day_of_month != null && !(Number.isInteger(v.day_of_month) && v.day_of_month >= 1 && v.day_of_month <= 31)) return "Day of the month must be 1 to 31";
  if (v.cadence === "yearly" && v.day_of_month != null && !(Number.isInteger(v.month_of_year) && v.month_of_year >= 1 && v.month_of_year <= 12)) return "Pick the month it renews";
  if (v.starts_on && !isDate(v.starts_on)) return "First payment date is not a date";
  if (v.ends_on && !isDate(v.ends_on)) return "Last payment date is not a date";
  if (v.starts_on && v.ends_on && v.ends_on < v.starts_on) return "Last payment is before the first";

}
function validExpected(v){
  if (!v.label) return "Add what it is (e.g. Noble go-live)";
  if (!v.who) return "Add who pays";
  if (!(v.amount > 0 && v.amount < 10000000)) return "Add the amount";
  if (!isDate(v.expected_on)) return "Add the expected date";
  if (!(Number.isInteger(v.window_days) && v.window_days >= 0 && v.window_days <= 14)) return "Window must be 0 to 14 days either side";

function chipTxt(i){

  if (i.type === "mrr") return `MRR ${i.late ? "late" : "due"}, ${shortName(i.who)} ${money0(i.amount)}`;
  return `${i.label} ${money0(i.amount)}, ${rangeTxt(i.from, i.to)}${i.late ? ", late" : ""}`;
}
const chkDot = i => (i.row && i.row.needs_check) ? '<span class="ck2" title="Marked check"></span>' : "";

  const day = c.day_of_month ? dayOrd(Number(c.day_of_month)) : null;

  if (id === "new-cost" || id === "new-exp") return { type: id };
  const [p, a, b] = String(id || "").split(":");
  if (p === "c" || p === "cost") { const row = (S.costs || []).find(x => x.id === a); return row ? { type: "cost", row, date: b || null } : null; }
  if (p === "e") { const row = (S.expected || []).find(x => x.id === a); return row ? { type: "exp", row } : null; }
  if (p === "k") { const row = S.cash.find(x => x.id === a); return row ? { type: "in", row } : null; }
  if (p === "m") { const deal = S.deals.find(x => x.id === a); return deal ? { type: "mrr", deal, ym: b } : null; }
  return null;
}
