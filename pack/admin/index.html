<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1014">
<title>Candidate Pack admin</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app.css?v=1">
<style>
  .adm-top{background:#0E1014;color:#fff}
  .adm-top .top-in{max-width:1180px}
  .adm .wrap{max-width:1180px}
  .agrid{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:900px){.agrid{grid-template-columns:1fr 1fr}}
  .acard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
  .acard .nm{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
  .stats div{background:var(--soft);border-radius:12px;padding:8px 10px;min-width:0}
  .stats b{display:block;font-size:18px;font-weight:800}
  .stats span{font-size:11.5px;color:var(--muted)}
  .steps{counter-reset:s;margin:0;padding:0;list-style:none}
  .steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative;font-size:14px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:8px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
</style>
</head>
<body class="adm">
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=1"></script>
<script src="../render.js?v=1"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
